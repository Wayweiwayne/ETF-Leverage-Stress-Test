   sources listed is ruined for good and its final value is zero, whatever it still holds in\n    sources left out of `order`. A forced sale in a crash month costs extra for either asset.\n\n    `payments` is (months,) or, when each path has its own loan rate, (months, paths). Every sale\n    pays `fee` plus `sell_tax`. Each dividend payout loses `dividend_tax_rate` of its taxable share,\n    plus `nhi_rate` of it when that share reaches `nhi_threshold`; the comparison portfolio is taxed\n    by the same rules on its own, smaller payouts. With `record=True` the per-month ledger is\n    returned as well. `quantiles` asks for those quantiles of net worth across paths in every\n    month (a ruined path counts as zero), and `keep_flows` for each month's salary payment and\n    comparison contribution per path.\n    \"\"\"\n    if dca_mode not in (DCA_MATCH_OUT_OF_POCKET, DCA_FULL_PAYMENT):\n        raise ValueError(f\"未知的 DCA 對照模式：{dca_mode}\")\n    order = _unique_order(order)\n    months, n_paths = ret_a.shape\n\n    prices_a = np.array(price_a0, dtype=float)\n    prices_b = np.array(price_b0, dtype=float)\n    shares_a = (principal - buffer_cash - loan_fee) * (1 - fee) / prices_a\n    exit_cost = fee + sell_tax\n    shares_b = np.zeros(n_paths)\n    div_pools = np.zeros(n_paths)\n    buf_vals = np.full(n_paths, float(buffer_cash))\n    is_ruined = np.zeros(n_paths, dtype=bool)\n    ruin_month = np.zeros(n_paths, dtype=int)\n    out_of_pocket = np.zeros(n_paths)\n    dca_invested = np.zeros(n_paths)\n    spread = {\"lev\": [], \"dca\": [], \"alive\": []} if quantiles is not None else None\n    flows = {\"salary\": [], \"dca\": []} if keep_flows else None\n\n    dca_shares_a = np.zeros(n_paths)\n    dca_shares_b = np.zeros(n_paths)\n    dca_div_pools = np.zeros(n_paths)\n\n    ledger = {k: [] for k in (\n        \"from_dividend\", \"from_buffer\", \"from_sell\", \"from_sell_b\", \"from_salary\", \"defaulted\",\n        \"shares_a\", \"shares_b\", \"lev_value\", \"dca_value\", \"dca_contribution\", \"dividend_tax\")} if record else None\n\n    def lev_value():\n        value = shares_a * prices_a * (1 - exit_cost) + div_pools + buf_vals\n        return value + shares_b * prices_b * (1 - exit_cost) if reinvest else value\n\n    def dca_value():\n        value = dca_shares_a * prices_a * (1 - exit_cost) + dca_div_pools\n        return value + dca_shares_b * prices_b * (1 - exit_cost) if reinvest else value\n\n    def dividend_levy(gross):\n        taxable = gross * dividend_taxable_share\n        return taxable * dividend_tax_rate + np.where(taxable >= nhi_threshold, taxable * nhi_rate, 0.0)\n\n    for i in range(months):\n        pmt = payments[i]\n        ret_a_i = ret_a[i, :]\n        prev_a = prices_a\n        prices_a = prices_a * (1 + ret_a_i)\n        prices_b = prices_b * (1 + ret_b[i, :])\n        div_per_share = prev_a * div_yield_a[i, :]\n\n        gross_div = shares_a * div_per_share\n        levy = dividend_levy(gross_div)\n        current_div = gross_div - levy\n        # A second asset that has gone to zero can no longer be bought; its share of the dividend buys the first.\n        share_to_b = np.where(prices_b > 0, ratio_b, 0.0)\n        with np.errstate(divide='ignore', invalid='ignore'):\n            if reinvest:\n                shares_b = shares_b + np.where(prices_b > 0, (current_div * share_to_b * (1 - fee)) / prices_b, 0.0)\n                shares_a = shares_a + np.where(prices_a > 0, (current_div * (1 - share_to_b) * (1 - fee)) / prices_a, 0.0)\n            else:\n                div_pools = div_pools + current_div\n\n        sell_cost = np.full(n_paths, exit_cost, dtype=float)\n        if haircut_penalty > 0:\n            sell_cost = np.where(ret_a_i < -haircut_trigger, np.minimum(0.99, exit_cost + haircut_penalty), exit_cost)\n\n        rem = np.where(is_ruined, 0.0, pmt)\n        used = {src: np.zeros(n_paths) for src in SOURCES}\n        for src in order:\n            if src == DIVIDEND:\n                pay = np.minimum(div_pools, rem)\n                div_pools = div_pools - pay\n            elif src == BUFFER:\n                pay = np.minimum(buf_vals, rem)\n                buf_vals = buf_vals - pay\n            elif src == SELL:\n                pay = np.minimum(np.maximum(shares_a * prices_a * (1 - sell_cost), 0.0), rem)\n                with np.errstate(divide='ignore', invalid='ignore'):\n                    shares_a = shares_a - np.where(prices_a > 0, (pay / (1 - sell_cost)) / prices_a, 0.0)\n            elif src == SELL_B:\n                pay = np.minimum(np.maximum(shares_b * prices_b * (1 - sell_cost), 0.0), rem)\n                with np.errstate(divide='ignore', invalid='ignore'):\n                    shares_b = shares_b - np.where(prices_b > 0, (pay / (1 - sell_cost)) / prices_b, 0.0)\n            else:\n                pay = np.minimum(np.maximum(salary_cap[i, :], 0.0), rem)\n            used[src] = pay\n            rem = rem - pay\n\n        defaulted = (rem > 1e-5) & (~is_ruined)\n\n        if dca_mode == DCA_FULL_PAYMENT:\n            contribution = np.broadcast_to(np.asarray(pmt, dtype=float), (n_paths,)).copy()\n        else:\n            # A path that already went bust no longer pays anything; its comparison portfolio\n            # keeps investing what salary could have covered.\n            contribution = np.where(is_ruined, np.minimum(pmt, np.maximum(salary_cap[i, :], 0.0)), used[SALARY])\n        is_ruined = is_ruined | defaulted\n        ruin_month[defaulted] = i + 1\n        out_of_pocket = out_of_pocket + used[SALARY]\n        dca_invested = dca_invested + contribution\n\n        dca_gross = dca_shares_a * div_per_share\n        dca_divs = dca_gross - dividend_levy(dca_gross)\n        with np.errstate(divide='ignore', invalid='ignore'):\n            if reinvest:\n                dca_shares_b = dca_shares_b + np.where(prices_b > 0, (dca_divs * share_to_b * (1 - fee)) / prices_b, 0.0)\n                dca_shares_a = dca_shares_a + np.where(\n                    prices_a > 0, ((dca_divs * (1 - share_to_b) + contribution) * (1 - fee)) / prices_a, 0.0)\n            else:\n                dca_div_pools = dca_div_pools + dca_divs\n                dca_shares_a = dca_shares_a + np.where(\n                    prices_a > 0, ((contribution + dca_div_pools) * (1 - fee)) / prices_a, 0.0)\n                dca_div_pools = np.zeros(n_paths)\n\n        if spread is not None:\n            spread[\"lev\"].append(np.quantile(np.where(is_ruined, 0.0, lev_value()), quantiles))\n            spread[\"dca\"].append(np.quantile(dca_value(), quantiles))\n            spread[\"alive\"].append(1.0 - is_ruined.mean())\n        if keep_flows:\n            flows[\"salary\"].append(used[SALARY])\n            flows[\"dca\"].append(contribution)\n        if record:\n            ledger[\"from_dividend\"].append(used[DIVIDEND])\n            ledger[\"from_buffer\"].append(used[BUFFER])\n            ledger[\"from_sell\"].append(used[SELL])\n            ledger[\"from_sell_b\"].append(used[SELL_B])\n            ledger[\"from_salary\"].append(used[SALARY])\n            ledger[\"defaulted\"].append(defaulted)\n            ledger[\"shares_a\"].append(shares_a)\n            ledger[\"shares_b\"].append(shares_b)\n            ledger[\"lev_value\"].append(lev_value())\n            ledger[\"dca_value\"].append(dca_value())\n            ledger[\"dca_contribution\"].append(contribution)\n            ledger[\"dividend_tax\"].append(levy)\n\n    lev_final = lev_value()\n    lev_final[is_ruined] = 0\n    if record:\n        ledger = {k: np.array(v) for k, v in ledger.items()}\n    if spread is not None:\n        spread = {k: np.array(v) for k, v in spread.items()}\n    if keep_flows:\n        flows = {k: np.array(v) for k, v in flows.items()}\n    return PathResults(is_ruined, lev_final, dca_value(), ruin_month, out_of_pocket, dca_invested,\n                       ledger, spread, flows)\n\n\ndef annual_irr(paid_in, final_value, iterations=40):\n    \"\"\"Money-weighted annual return for every path.\n\n    `paid_in` (months, paths) is what went in at the end of each month and `final_value` what\n    was there at the end of the last one. The result is the constant yearly return that turns\n    the former into the latter: NaN where nothing was paid in, -1 where nothing was left.\n    \"\"\"\n    paid_in = np.asarray(paid_in, dtype=float)\n    final_value = np.asarray(final_value, dtype=float)\n    months, n_paths = paid_in.shape\n    t = np.arange(1, months + 1)[:, None]\n    lo, hi = np.full(n_paths, -0.99), np.full(n_paths, 1.0)       # monthly rate\n    for _ in range(iterations):\n        mid = (lo + hi) / 2\n        log_growth = np.log1p(mid)\n        npv = final_value * np.exp(-months * log_growth) - (paid_in * np.exp(-t * log_growth[None, :])).sum(axis=0)\n        lo, hi = np.where(npv > 0, mid, lo), np.where(npv > 0, hi, mid)\n    annual = (1 + (lo + hi) / 2) ** 12 - 1\n    annual = np.where(final_value <= 0, -1.0, annual)\n    return np.where(paid_in.sum(axis=0) <= 0, np.nan, annual)\n\n\nFAN_QUANTILES = (0.05, 0.25, 0.50, 0.75, 0.95)\n\n\ndef lump_dividends(monthly_amounts, interval):\n    \"\"\"Turn an even monthly payout into one every `interval` months (months run along axis 0).\n\n    A payout month pays `interval` times its monthly amount and the months in between pay nothing,\n    so the annual total is about the same while the cash arrives in fewer, larger pieces.\n    \"\"\"\n    if interval <= 1:\n        return monthly_amounts\n    out = np.zeros_like(monthly_amounts)\n    paying = (np.arange(monthly_amounts.shape[0]) + 1) % interval == 0\n    out[paying] = monthly_amounts[paying] * interval\n    return out\n\n\ndef infer_dividend_interval(div_yields, window=36):\n    \"\"\"Months between payouts suggested by the latest record: 1, 3, 6 or 12.\"\"\"\n    recent = np.asarray(div_yields)[-window:]\n    payouts = int((recent > 0).sum())\n    if payouts == 0:\n        return 1\n    gap = len(recent) / payouts\n    return min((1, 3, 6, 12), key=lambda k: abs(np.log(k / gap)))\n\n\ndef dividend_model_yields(price_path, p_init, base_ann_yield, beta, interval=1):\n    \"\"\"Dividend-beta model: payout scales with cumulative return, floored at 10% of the base amount.\n\n    Returned as a fraction of the previous month's price, the convention simulate_paths expects.\n    \"\"\"\n    base_div_amt = p_init * base_ann_yield / 12.0\n    cum_ret = (price_path / p_init) - 1.0\n    div_amt = lump_dividends(np.maximum(base_div_amt * 0.1, base_div_amt * (1 + cum_ret * beta)), interval)\n    previous = np.concatenate((np.full_like(price_path[:1], p_init), price_path[:-1]), axis=0)\n    with np.errstate(divide='ignore', invalid='ignore'):\n        return np.where(previous > 0, div_amt / previous, 0.0)\n\n\ndef simulate_unemployment(ret_paths, full_salary, job_loss, rng):\n    \"\"\"Per-month, per-path salary cap under a two-state (employed/unemployed) random model.\n\n    Each month an employed path loses its job with the monthly equivalent of `annual_prob`;\n    when `crash_linked`, a month falling more than `crash_threshold` adds a further annual\n    probability drawn from U(crash_extra_low, crash_extra_high). Spell length is lognormal or\n    Poisson with the given mean, at least one month. Re-employed paths can lose the job again.\n    \"\"\"\n    months, n_paths = ret_paths.shape\n    annual_prob = job_loss.annual_prob\n    monthly_base = 1.0 - (1.0 - annual_prob) ** (1.0 / 12.0) if annual_prob > 0 else 0.0\n    caps = np.full((months, n_paths), float(full_salary))\n    is_unemp = np.zeros(n_paths, dtype=bool)\n    remaining = np.zeros(n_paths, dtype=int)\n\n    def draw_duration(n):\n        if job_loss.distribution == \"poisson\":\n            d = rng.poisson(max(job_loss.mean_duration, 1e-9), size=n)\n        else:\n            sigma = max(0.05, job_loss.duration_sigma)\n            mu = np.log(max(job_loss.mean_duration, 1e-9)) - 0.5 * sigma ** 2\n            d = rng.lognormal(mu, sigma, size=n)\n        return np.maximum(1, np.round(d).astype(int))\n\n    for i in range(months):\n        p_loss = np.full(n_paths, monthly_base)\n        if job_loss.crash_linked:\n            crashed = ret_paths[i, :] < -job_loss.crash_threshold\n            extra_ann = rng.uniform(job_loss.crash_extra_low, job_loss.crash_extra_high, size=n_paths)\n            extra_monthly = 1.0 - (1.0 - extra_ann) ** (1.0 / 12.0)\n            p_loss = np.where(crashed, np.minimum(0.99, monthly_base + extra_monthly), monthly_base)\n\n        new_loss = (~is_unemp) & (rng.random(n_paths) < p_loss)\n        if new_loss.any():\n            remaining[new_loss] = draw_duration(int(new_loss.sum()))\n            is_unemp[new_loss] = True\n\n        caps[i, is_unemp] = float(job_loss.unemployed_salary)\n\n        remaining[is_unemp] -= 1\n        re_employed = is_unemp & (remaining <= 0)\n        is_unemp[re_employed] = False\n        remaining[re_employed] = 0\n\n    return caps\n\n\ndef validate_params(p):\n    \"\"\"Reject settings the simulation cannot give a meaningful answer for.\"\"\"\n    def need(ok, message):\n        if not ok:\n            raise ValueError(message)\n\n    finite = np.isfinite\n    need(finite(p.principal) and p.principal > 0, \"貸款本金必須大於 0。\")\n    need(finite(p.annual_rate_pct) and p.annual_rate_pct >= 0, \"貸款利率不可為負。\")\n    need(p.annual_rate_pct + p.rate_shock_delta_pct >= 0, \"升息後的利率不可為負。\")\n    need(int(p.total_months) == p.total_months and p.total_months >= 1, \"貸款期數至少需要 1 個月。\")\n    need(0 <= p.grace_months < p.total_months, \"寬限期必須短於貸款總年限。\")\n    need(p.rate_shock_year >= 0 and p.buffer_months >= 0, \"升息年份與緩衝月數不可為負。\")\n    need(0 <= p.reinvest_ratio_b <= 1, \"配息投入第二標的的比例必須介於 0 與 1。\")\n    need(0 <= p.fee < 1, \"手續費必須介於 0 與 100% 之間。\")\n    need(finite(p.salary_cap) and p.salary_cap >= 0, \"每月薪水補貼上限不可為負。\")\n    need(0 <= p.haircut_penalty < 1 and p.haircut_trigger >= 0, \"賤賣折價設定超出範圍。\")\n    need(0 <= p.swan_drop <= 1 and p.swan_month >= 0, \"黑天鵝跌幅必須介於 0 與 100% 之間。\")\n    need(p.base_div_yield >= 0 and p.div_beta >= 0, \"股息率與股息連動程度不可為負。\")\n    need(len(p.future_annual_returns) >= 1 and all(finite(r) and r > -100 for r in p.future_annual_returns),\n         \"未來情境的年度報酬率必須大於 -100%。\")\n    need(1 <= p.mc_paths <= 100_000, \"蒙地卡羅次數必須介於 1 與 100,000。\")\n    need(p.block_size >= 1, \"區塊長度至少 1 個月。\")\n    need(p.dca_mode in (DCA_MATCH_OUT_OF_POCKET, DCA_FULL_PAYMENT), f\"未知的 DCA 對照模式：{p.dca_mode}\")\n    need(p.mc_dividends in (MC_DIVIDENDS_HISTORY, MC_DIVIDENDS_MODEL), f\"未知的蒙地卡羅配息來源：{p.mc_dividends}\")\n    need(all(finite(d) and abs(d) <= 10 for d in p.rate_path_pct), \"每年利率變動必須介於 -10 與 10 個百分點之間。\")\n    need(finite(p.rate_volatility_pct) and 0 <= p.rate_volatility_pct <= 5, \"利率隨機波動必須介於 0 與 5 個百分點。\")\n    need(0 <= p.sell_tax < 1 and p.fee + p.sell_tax < 1, \"賣出的稅費合計必須低於 100%。\")\n    need(0 <= p.dividend_tax_rate <= 1 and 0 <= p.nhi_rate <= 1 and p.dividend_tax_rate + p.nhi_rate <= 1,\n         \"股利的稅率與補充保費費率必須介於 0 與 100%，合計不可超過 100%。\")\n    need(p.nhi_threshold >= 0 and 0 <= p.dividend_taxable_share <= 1, \"補充保費門檻或股利所得比例超出範圍。\")\n    need(finite(p.loan_fee) and 0 <= p.loan_fee < p.principal, \"貸款開辦費必須小於貸款本金。\")\n    need(p.dividend_interval_months in (0, 1, 3, 6, 12), \"配息頻率必須是每 1、3、6 或 12 個月（或 0 代表依歷史判斷）。\")\n    _unique_order(p.source_order)\n    job = p.job_loss\n    need(job.mode in (JOB_LOSS_NONE, JOB_LOSS_MANUAL, JOB_LOSS_RANDOM), f\"未知的失業模型：{job.mode}\")\n    need(job.unemployed_salary >= 0, \"失業期間的薪水支援不可為負。\")\n    if job.mode == JOB_LOSS_RANDOM:\n        need(0 <= job.annual_prob <= 1, \"年失業機率必須介於 0 與 1。\")\n        need(job.mean_duration > 0, \"平均失業月數必須大於 0。\")\n        need(job.distribution in (\"lognormal\", \"poisson\"), f\"未知的失業時間分佈：{job.distribution}\")\n        need(0 <= job.crash_extra_low <= job.crash_extra_high <= 1, \"崩盤時額外失業機率的範圍不正確。\")\n\n\ndef bootstrap_indices(rng, n, block, months, n_paths):\n    \"\"\"Row indices for a circular block bootstrap, shape (months, n_paths).\n\n    Blocks may start anywhere and wrap from the last month back to the first, so every month\n    of the record is equally likely to be drawn. Without wrapping, the first and last months\n    would appear less often than the rest.\n    \"\"\"\n    blocks_needed = -(-months // block)\n    starts = rng.randint(0, n, size=(blocks_needed, n_paths))\n    idx = (starts[:, None, :] + np.arange(block)[None, :, None]) % n\n    return idx.reshape(-1, n_paths)[:months, :]\n\n\ndef monte_carlo_inputs(m, p, rng):\n    \"\"\"Resampled returns and dividend yields for every Monte Carlo path, each of shape (months, paths).\n\n    A resampled month brings its price return, the second asset's return and, unless the\n    assumed-yield model is chosen, the dividend actually paid that month. Drawing them together\n    keeps a payout next to the ex-dividend price drop it caused, and gives an asset that never\n    paid anything no dividends.\n    \"\"\"\n    months, n_paths = p.total_months, int(p.mc_paths)\n    m_disc = p.structural_discount_pct / 100.0 / 12.0\n    idx = bootstrap_indices(rng, m.n, int(max(1, min(p.block_size, m.n))), months, n_paths)\n    ret_a = m.ret_a[idx] - m_disc\n    ret_b = m.ret_b[idx] - m_disc if m.has_b else np.zeros((months, n_paths))\n    _inject_swan(ret_a, ret_b, p.swan_month, p.swan_drop, m.beta_b, m.has_b)\n    if p.mc_dividends == MC_DIVIDENDS_HISTORY:\n        div_a = m.div_a[idx]\n    else:\n        div_a = dividend_model_yields(np.cumprod(1 + ret_a, axis=0), 1.0, p.base_div_yield, p.div_beta,\n                                      m.dividend_interval)\n    return ret_a, ret_b, div_a\n\n\ndef _future_monthly_returns(annual_returns, months):\n    if len(annual_returns) == 0:\n        raise ValueError(\"請至少輸入一個年度報酬率。\")\n    monthly = []\n    for ar in annual_returns:\n        monthly.extend([(1 + ar / 100.0) ** (1 / 12) - 1] * 12)\n    while len(monthly) < months:\n        monthly.extend(monthly[-12:])\n    return np.array(monthly)\n\n\ndef _inject_swan(ret_a, ret_b, month, drop, beta_b, has_b):\n    \"\"\"One-off crash in a given month; the second asset is hit beta times as hard.\n\n    Returns are floored at -100% so a price can reach zero but never turn negative.\n    \"\"\"\n    if drop > 0 and 1 <= month <= ret_a.shape[0]:\n        m = month - 1\n        ret_a[m, :] = np.maximum(ret_a[m, :] - drop, -1.0)\n        if has_b:\n            ret_b[m, :] = np.maximum(ret_b[m, :] - drop * beta_b, -1.0)\n\n\ndef modelled_second_asset_return(ret_a, noise, beta, decay, compounding):\n    \"\"\"Second-asset return for a month in which it has no real data.\n\n    It follows the main asset with sensitivity `beta` and carries no excess return of its own:\n    whatever it out- or under-performed by in the sample is not projected. With `compounding`\n    the month is treated the way a daily-rebalanced leveraged fund behaves, (1 + r)^beta less\n    the volatility decay beta*(beta-1)/2 * variance; without it the return is simply beta * r.\n    \"\"\"\n    if compounding:\n        base = np.maximum(1 + ret_a, 1e-9) ** beta * np.exp(-decay) - 1\n    else:\n        base = beta * ret_a\n    return np.clip(base + noise, -1.0, 10.0)\n\n\ndef _prepare_market(df, p):\n    n = len(df)\n    if n < 1:\n        raise ValueError(\"沒有可回測的月份。\")\n    ret_a = df[\"Price_Return_A\"].to_numpy(dtype=float)\n    div_a = df[\"Div_Yield_A\"].to_numpy(dtype=float)\n    close_a = df[\"Close_A\"].to_numpy(dtype=float)\n    synthetic_a = (df[\"Synthetic_A\"].to_numpy(dtype=bool) if \"Synthetic_A\" in df.columns\n                   else np.zeros(n, dtype=bool))\n\n    has_b = bool(p.reinvest and \"Close_B\" in df.columns and df[\"Price_Return_B\"].notna().any())\n    ret_b, close_b = np.zeros(n), np.ones(n)\n    beta_b, resid_std_b, decay, modelled = 1.0, 0.0, 0.0, 0\n    if has_b:\n        ret_b = df[\"Price_Return_B\"].to_numpy(dtype=float).copy()\n        close_b = df[\"Close_B\"].to_numpy(dtype=float).copy()\n        real = ~np.isnan(ret_b)\n        if real.sum() >= _MIN_OVERLAP_FOR_BETA:\n            cov = np.cov(ret_a[real], ret_b[real])\n            if cov[0, 0] > 0:\n                beta_b = float(cov[0, 1] / cov[0, 0])\n                alpha = ret_b[real].mean() - beta_b * ret_a[real].mean()\n                resid_std_b = float(np.std(ret_b[real] - (alpha + beta_b * ret_a[real]), ddof=1))\n        sigma_a = float(np.std(ret_a, ddof=1)) if n > 1 else 0.0\n        if p.vol_drag:\n            decay = max(0.0, 0.5 * beta_b * (beta_b - 1)) * sigma_a ** 2\n        missing = ~real\n        modelled = int(missing.sum())\n        if modelled:\n            rng = np.random.RandomState(_BACKFILL_SEED)\n            noise = rng.normal(0, resid_std_b, size=modelled) if resid_std_b > 0 else 0.0\n            ret_b[missing] = modelled_second_asset_return(ret_a[missing], noise, beta_b, decay, p.vol_drag)\n            close_b[missing] = close_b[real][0]  # only relative moves matter; any positive level will do\n    interval = p.dividend_interval_months or infer_dividend_interval(div_a)\n    return _Market(n, ret_a, div_a, close_a, synthetic_a, has_b, ret_b, close_b, modelled,\n                   beta_b, resid_std_b, decay, int(interval))\n\n\ndef _history_paths(m, p):\n    \"\"\"Return, yield and cap inputs for every entry month.\n\n    Entering in month i means buying at that month's price; the first payment falls due one\n    month later, so the path uses the returns of months i+1 onwards. Whatever the real record\n    cannot cover is filled with the scenario.\n    \"\"\"\n    months, n = p.total_months, m.n\n    m_disc = p.structural_discount_pct / 100.0 / 12.0\n    future = _future_monthly_returns(p.future_annual_returns, months)\n    splice_rng = np.random.RandomState(_SPLICE_SEED)\n\n    ret_a = np.zeros((months, n))\n    ret_b = np.zeros((months, n))\n    div_a = np.zeros((months, n))\n    win_lens = np.minimum(months, n - 1 - np.arange(n))\n\n    for i in range(n):\n        win = int(win_lens[i])\n        fut = months - win\n        rows = slice(i + 1, i + 1 + win)\n        ret_a[:win, i] = m.ret_a[rows] - m_disc\n        div_a[:win, i] = m.div_a[rows]\n        if m.has_b:\n            ret_b[:win, i] = m.ret_b[rows] - m_disc\n        if fut > 0:\n            mr = future[:fut] - m_disc\n            ret_a[win:, i] = mr\n            if m.has_b:\n                noise = splice_rng.normal(0, m.resid_std_b, size=fut) if m.resid_std_b > 0 else 0.0\n                ret_b[win:, i] = modelled_second_asset_return(mr, noise, m.beta_b, m.decay, p.vol_drag)\n            p_end = m.close_a[i + win]\n            path = np.cumprod(np.concatenate(([p_end], 1 + mr)))\n            p_prev, p_next = path[:-1], path[1:]\n            base_div = p_end * p.base_div_yield / 12.0\n            div_amt = np.maximum(base_div * 0.1, base_div * (1 + ((p_next / p_end) - 1) * p.div_beta))\n            div_amt = lump_dividends(div_amt, m.dividend_interval)\n            with np.errstate(divide='ignore', invalid='ignore'):\n                div_a[win:, i] = np.where(p_prev > 0, div_amt / p_prev, 0.0)\n\n    _inject_swan(ret_a, ret_b, p.swan_month, p.swan_drop, m.beta_b, m.has_b)\n\n    # An entry month counts as backfilled when it, or any real month it relies on, uses proxy data.\n    synthetic_before = np.concatenate(([0], np.cumsum(m.synthetic_a)))\n    backfilled = (synthetic_before[np.arange(n) + win_lens + 1] - synthetic_before[np.arange(n)]) > 0\n    return ret_a, ret_b, div_a, win_lens, backfilled\n\n\ndef _history_caps(ret_a_hist, p):\n    \"\"\"Salary caps for every entry month, repeated over several unemployment draws when random.\"\"\"\n    months, n = ret_a_hist.shape\n    if p.job_loss.mode != JOB_LOSS_RANDOM:\n        base = salary_cap_schedule(p.salary_cap, p.job_loss, months)\n        return np.repeat(base.reshape(-1, 1), n, axis=1), 1\n    replicates = int(np.clip(_HIST_MAX_PATHS // n, 1, _HIST_MAX_REPLICATES))\n    caps = simulate_unemployment(np.tile(ret_a_hist, (1, replicates)), p.salary_cap, p.job_loss,\n                                 np.random.RandomState(_HIST_JOB_LOSS_SEED))\n    return caps, replicates\n\n\ndef _common_args(p, schedule, buffer_cash, ratio_b):\n    return dict(payments=schedule.payments, principal=p.principal, buffer_cash=buffer_cash, fee=p.fee,\n                reinvest=p.reinvest, ratio_b=ratio_b, order=p.source_order,\n                haircut_trigger=p.haircut_trigger, haircut_penalty=p.haircut_penalty, dca_mode=p.dca_mode,\n                sell_tax=p.sell_tax, dividend_tax_rate=p.dividend_tax_rate, nhi_rate=p.nhi_rate,\n                nhi_threshold=p.nhi_threshold, dividend_taxable_share=p.dividend_taxable_share,\n                loan_fee=p.loan_fee)\n\n\ndef _setup(df, p):\n    validate_params(p)\n    market = _prepare_market(df, p)\n    schedule = build_loan_schedule(p.principal, p.annual_rate_pct, p.total_months, p.grace_months,\n                                   p.rate_shock_year, p.rate_shock_delta_pct, p.rate_path_pct)\n    # The fee comes out of the proceeds first; the buffer can take at most what is left.\n    buffer_cash = min(buffer_cash_for(schedule, p.grace_months, p.buffer_months, p.principal),\n                      p.principal - p.loan_fee)\n    ratio_b = p.reinvest_ratio_b if market.has_b else 0.0\n    return market, schedule, _common_args(p, schedule, buffer_cash, ratio_b), buffer_cash\n\n\ndef _monte_carlo(m, p, schedule, common, detail):\n    \"\"\"Block-bootstrap Monte Carlo over every path; needs at least two months of data.\n\n    `detail` adds the per-month net-worth range and the cash flows run_summary reports; whether\n    a path is ruined does not depend on it. Returns the PathResults, the share of paths that were\n    ever unemployed, the average months unemployed, the average annual dividend yield and the\n    5th and 95th percentile of the final annual loan rate.\n    \"\"\"\n    months, n_paths = p.total_months, int(p.mc_paths)\n    any_rate, avg_months = 0.0, 0.0\n    ret_a_mc, ret_b_mc, div_a_mc = monte_carlo_inputs(m, p, np.random.RandomState(p.seed))\n    mc_dividend_yield = float(div_a_mc.mean() * 12)\n\n    if p.job_loss.mode == JOB_LOSS_RANDOM:\n        job_rng = np.random.RandomState(None if p.seed is None else p.seed + 1)\n        caps_mc = simulate_unemployment(ret_a_mc, p.salary_cap, p.job_loss, job_rng)\n        unemployed = caps_mc < p.salary_cap\n        any_rate = float(unemployed.any(axis=0).mean())\n        avg_months = float(unemployed.sum(axis=0).mean())\n    else:\n        base = salary_cap_schedule(p.salary_cap, p.job_loss, months)\n        caps_mc = np.repeat(base.reshape(-1, 1), n_paths, axis=1)\n\n    # Each path may carry its own loan rate, hence its own payments.\n    rate_rng = np.random.RandomState(None if p.seed is None else p.seed + 2)\n    rates_mc = monte_carlo_rate_paths(p, rate_rng, n_paths)\n    final_rates = np.atleast_1d(rates_mc[-1])\n    rate_p5, rate_p95 = (float(np.percentile(final_rates, q)) for q in (5, 95))\n    payments_mc = (schedule_from_rates(p.principal, rates_mc, p.grace_months).payments\n                   if rates_mc.ndim == 2 else schedule.payments)\n\n    # Only relative price moves matter, so every path starts from a price of 1.\n    mc = simulate_paths(ret_a_mc, ret_b_mc, div_a_mc, np.ones(n_paths), np.ones(n_paths),\n                        salary_cap=caps_mc, quantiles=FAN_QUANTILES if detail else None, keep_flows=detail,\n                        **{**common, \"payments\": payments_mc})\n    return mc, any_rate, avg_months, mc_dividend_yield, rate_p5, rate_p95\n\n\ndef run_summary(df, params):\n    \"\"\"Run both engines on aligned monthly data (see market_data.align_months).\n\n    Rolling history: one row per entry month. Monte Carlo: one row per path; it resamples the\n    whole record and does not depend on any particular entry month.\n    \"\"\"\n    p = params\n    m, schedule, common, buffer_cash = _setup(df, p)\n    months, n = p.total_months, m.n\n\n    # --- Rolling history ---\n    ret_a_hist, ret_b_hist, div_a_hist, win_lens, backfilled = _history_paths(m, p)\n    caps_hist, reps = _history_caps(ret_a_hist, p)\n    tile = (lambda x: np.tile(x, (1, reps))) if reps > 1 else (lambda x: x)\n    hist = simulate_paths(tile(ret_a_hist), tile(ret_b_hist), tile(div_a_hist),\n                          np.tile(m.close_a, reps), np.tile(m.close_b, reps), salary_cap=caps_hist, **common)\n    ruined = hist.ruined.reshape(reps, n)\n    lev = hist.lev_final.reshape(reps, n)\n    dca = hist.dca_final.reshape(reps, n)\n    alive = (~ruined).any(axis=0)\n    survivors = np.full(n, np.nan)\n    survivors[alive] = np.nanmedian(np.where(ruined, np.nan, lev)[:, alive], axis=0)\n    ruin_prob = ruined.mean(axis=0)\n    df_hist = pd.DataFrame({\n        \"Start_Date\": df.index,\n        \"Ruin_Prob\": ruin_prob,\n        \"Is_Ruined\": ruin_prob > 0.5,\n        \"Is_Spliced\": win_lens < months,\n        \"Is_Backfilled\": backfilled,\n        \"Lev_Final\": np.median(lev, axis=0),\n        \"Lev_Final_Survivors\": survivors,\n        \"DCA_Final\": np.median(dca, axis=0),\n        \"Lev_Win\": ((~ruined) & (lev > dca)).mean(axis=0),\n    })\n\n    # --- Monte Carlo: block bootstrap of the monthly record ---\n    block = int(max(1, min(p.block_size, n)))\n    mc_ok = n >= 2\n    any_rate, avg_months, mc_dividend_yield = 0.0, 0.0, 0.0\n    rate_p5 = rate_p95 = float(schedule.monthly_rates[-1] * 12 * 100)\n    if mc_ok:\n        mc, any_rate, avg_months, mc_dividend_yield, rate_p5, rate_p95 = _monte_carlo(\n            m, p, schedule, common, detail=True)\n        df_mc = pd.DataFrame({\n            \"Is_Ruined\": mc.ruined, \"Lev_Final\": mc.lev_final, \"DCA_Final\": mc.dca_final,\n            \"Lev_Win\": (~mc.ruined) & (mc.lev_final > mc.dca_final), \"Ruin_Month\": mc.ruin_month,\n            \"Out_Of_Pocket\": mc.out_of_pocket, \"DCA_Invested\": mc.dca_invested,\n            \"Lev_IRR\": annual_irr(mc.flows[\"salary\"], mc.lev_final),\n            \"DCA_IRR\": annual_irr(mc.flows[\"dca\"], mc.dca_final),\n        })\n        names = [f\"p{round(q * 100)}\" for q in FAN_QUANTILES]\n        mc_fan = pd.DataFrame(mc.value_quantiles[\"lev\"], columns=[f\"lev_{n}\" for n in names])\n        mc_fan[[f\"dca_{n}\" for n in names]] = mc.value_quantiles[\"dca\"]\n        mc_fan.insert(0, \"month\", np.arange(1, months + 1))\n        mc_fan[\"alive\"] = mc.value_quantiles[\"alive\"]\n        mc_fan[\"loan_balance\"] = schedule.end_balance\n    else:\n        df_mc = pd.DataFrame(columns=[\"Is_Ruined\", \"Lev_Final\", \"DCA_Final\", \"Lev_Win\", \"Ruin_Month\",\n                                      \"Out_Of_Pocket\", \"DCA_Invested\", \"Lev_IRR\", \"DCA_IRR\"])\n        mc_fan = None\n\n    return EngineResults(hist=df_hist, mc=df_mc, schedule=schedule, buffer_cash=buffer_cash,\n                         block_size=block, mc_ok=mc_ok, vol_drag=float(m.decay), beta_b=float(m.beta_b),\n                         job_loss_any_rate=any_rate, job_loss_avg_months=avg_months,\n                         mc_dividend_yield=mc_dividend_yield, dividend_interval=m.dividend_interval,\n                         mc_final_rate_p5=rate_p5, mc_final_rate_p95=rate_p95,\n                         hist_replicates=reps, modelled_b_months=m.modelled_b_months, mc_fan=mc_fan)\n\n\ndef run_trace(df, params, anchor_idx):\n    \"\"\"Month-by-month ledger for one entry month.\n\n    It reruns the very simulation behind that month's row in the rolling-history results, so the\n    two cannot drift apart. Row k is the k-th month after entry. With random job loss it shows the\n    first of that month's unemployment draws.\n    \"\"\"\n    p = params\n    m, schedule, common, _ = _setup(df, p)\n    if not 0 <= anchor_idx < m.n:\n        raise ValueError(\"進場月份超出資料範圍。\")\n    ret_a_hist, ret_b_hist, div_a_hist, _, _ = _history_paths(m, p)\n    caps_hist, _ = _history_caps(ret_a_hist, p)\n    col = slice(anchor_idx, anchor_idx + 1)\n    one = simulate_paths(ret_a_hist[:, col], ret_b_hist[:, col], div_a_hist[:, col], m.close_a[col],\n                         m.close_b[col], salary_cap=caps_hist[:, col], record=True, **common)\n    ledger = one.ledger\n\n    months = p.total_months\n    defaulted = ledger[\"defaulted\"][:, 0]\n    last = int(np.argmax(defaulted)) + 1 if defaulted.any() else months\n    dates, projected = [], []\n    for k in range(1, last + 1):\n        row = anchor_idx + k\n        if row < m.n:\n            dates.append(df.index[row])\n            projected.append(False)\n        else:\n            dates.append(df.index[-1] + pd.DateOffset(months=row - m.n + 1))\n            projected.append(True)\n    return pd.DataFrame({\n        \"month\": np.arange(1, last + 1),\n        \"date\": dates,\n        \"projected\": projected,\n        \"lev_value\": np.maximum(ledger[\"lev_value\"][:last, 0], 0),\n        \"dca_value\": np.maximum(ledger[\"dca_value\"][:last, 0], 0),\n        \"loan_balance\": schedule.end_balance[:last],\n        \"annual_rate_pct\": schedule.monthly_rates[:last] * 12 * 100,\n        \"defaulted\": defaulted[:last],\n        \"payment\": schedule.payments[:last],\n        \"from_dividend\": ledger[\"from_dividend\"][:last, 0],\n        \"from_buffer\": ledger[\"from_buffer\"][:last, 0],\n        \"from_sell\": ledger[\"from_sell\"][:last, 0],\n        \"from_sell_b\": ledger[\"from_sell_b\"][:last, 0],\n        \"dividend_tax\": ledger[\"dividend_tax\"][:last, 0],\n        \"from_salary\": ledger[\"from_salary\"][:last, 0],\n        \"dca_contribution\": ledger[\"dca_contribution\"][:last, 0],\n        \"shares_a\": ledger[\"shares_a\"][:last, 0],\n        \"shares_b\": ledger[\"shares_b\"][:last, 0],\n    })\n\n\ndef run(df, params, anchor_idx):\n    \"\"\"Both engines plus the ledger of entry month `anchor_idx`, in one call.\"\"\"\n    result = run_summary(df, params)\n    result.trace = run_trace(df, params, anchor_idx)\n    return result\n\n\n@dataclass(frozen=True)\nclass SolveResult:\n    field: str           # \"principal\" or \"salary_cap\"\n    value: float | None  # the limit found, lo + k*step or hi; None when nothing in the range meets the target\n    ruin_rate: float     # Monte Carlo ruin rate at `value`; with no value, at the end closest to the target\n    target: float        # highest acceptable ruin rate\n    status: str          # \"ok\", \"all_meet\" (the whole range meets it) or \"none_meet\" (none of it does)\n    evaluations: int     # Monte Carlo runs actually made\n\n\ndef _solve_seed(params):\n    return _SOLVE_SEED if params.seed is None else params.seed\n\n\ndef _require_monte_carlo(df):\n    if len(df) < 2:\n        raise ValueError(\"資料至少需要 2 個月才能跑蒙地卡羅模擬。\")\n\n\ndef _mc_ruin_rate(df, p):\n    \"\"\"Share of Monte Carlo paths ruined, exactly as run_summary would report it, without the rolling history.\"\"\"\n    m, schedule, common, _ = _setup(df, p)\n    return float(_monte_carlo(m, p, schedule, common, detail=False)[0].ruined.mean())\n\n\ndef solve_for(df, params, field, target_ruin, lo, hi, step):\n    \"\"\"Safety limit of one setting: the Monte Carlo ruin rate must stay at or below `target_ruin`.\n\n    `field=\"principal\"` finds the largest loan, `field=\"salary_cap\"` the smallest monthly\n    out-of-pocket cap, among lo, lo + step, lo + 2*step, ... up to hi, and hi itself when it is\n    not on that grid. Every other setting comes from `params`. Every evaluation draws the same\n    paths (seed 42 when `params.seed` is None), so the ruin rate moves with the setting alone.\n\n    The search is a bisection that takes the ruin rate as never falling with a bigger loan and\n    never rising with a higher cap. The health-levy threshold can break that by a hair; the edge\n    found is then a point where the rate crosses the target, not necessarily the last one, and\n    the rate reported is always one actually simulated. It runs at most\n    max(2, ceil(log2((hi - lo) / step)) + 3) simulations, and exactly one when lo == hi.\n    \"\"\"\n    if field not in _SOLVE_FIELDS:\n        raise ValueError(f\"求解項目必須是 principal（貸款本金）或 salary_cap（每月自掏上限），收到：{field!r}\")\n    if not 0 < target_ruin < 1:\n        raise ValueError(\"目標破產率必須介於 0 與 1 之間（不含 0 與 1）。\")\n    if not all(np.isfinite(v) for v in (lo, hi, step)):\n        raise ValueError(\"搜尋範圍與間距必須是有限的數字。\")\n    if lo > hi:\n        raise ValueError(\"搜尋下限不可大於上限。\")\n    if step <= 0:\n        raise ValueError(\"搜尋間距必須大於 0。\")\n    if lo < 0:\n        raise ValueError(\"搜尋下限不可為負。\")\n    if field == \"principal\" and lo == 0:\n        raise ValueError(\"貸款本金的搜尋下限必須大於 0。\")\n    _require_monte_carlo(df)\n\n    # Grid points lo + k*step up to hi; when hi is off the grid it is one extra point past the last.\n    top = int(math.floor((hi - lo) / step + 1e-9))\n    on_grid = math.isclose(lo + top * step, hi, rel_tol=1e-12, abs_tol=1e-9 * step)\n    last = top if on_grid else top + 1\n    base = replace(params, seed=_solve_seed(params))\n    rates = {}\n\n    def value(k):\n        return float(hi) if k == last else float(lo + k * step)\n\n    def meets(k):\n        if k not in rates:\n            rates[k] = _mc_ruin_rate(df, replace(base, **{field: value(k)}))\n        return rates[k] <= target_ruin\n\n    def result(k, status):\n        return SolveResult(field, None if status == \"none_meet\" else value(k), rates[k], float(target_ruin),\n                           status, len(rates))\n\n    if field == \"principal\":\n        if meets(last):\n            return result(last, \"all_meet\")\n        if not meets(0):\n            return result(0, \"none_meet\")\n        good, bad = 0, last\n    else:\n        if meets(0):\n            return result(0, \"all_meet\")\n        if not meets(last):\n            return result(last, \"none_meet\")\n        good, bad = last, 0\n    while abs(good - bad) > 1:\n        mid = (good + bad) // 2\n        if meets(mid):\n            good = mid\n        else:\n            bad = mid\n    return result(good, \"ok\")\n\n\ndef sensitivity_grid(df, params, principals, salary_caps, mc_paths=1000):\n    \"\"\"Monte Carlo ruin rate for every pair of loan principal (rows) and monthly out-of-pocket cap (columns).\n\n    Rows and columns keep the order given, repeated values included. Every other setting comes\n    from `params`, with `mc_paths` paths, and every cell draws the same paths (seed 42 when\n    `params.seed` is None).\n    \"\"\"\n    principals, salary_caps = list(principals), list(salary_caps)\n    if not principals or not salary_caps:\n        raise ValueError(\"貸款本金與每月自掏上限都至少要有一個值。\")\n    if not all(np.isfinite(v) and v > 0 for v in principals):\n        raise ValueError(\"熱圖的貸款本金必須大於 0。\")\n    if not all(np.isfinite(v) and v >= 0 for v in salary_caps):\n        raise ValueError(\"熱圖的每月自掏上限不可為負。\")\n    _require_monte_carlo(df)\n    base = replace(params, seed=_solve_seed(params), mc_paths=mc_paths)\n    rates = [[_mc_ruin_rate(df, replace(base, principal=pr, salary_cap=cap)) for cap in salary_caps]\n             for pr in principals]\n    return pd.DataFrame(rates, index=principals, columns=salary_caps, dtype=float)\n","market_data.py":"\"\"\"Market-data loading, repair and calendar-month alignment, independent of the UI.\"\"\"\nimport io\nimport json\nimport os\nimport re\nimport sys\nimport threading\nimport time\nimport urllib.parse\nimport urllib.request\nfrom datetime import datetime, timedelta, timezone\n\nimport numpy as np\nimport pandas as pd\n\ntry:\n    import yfinance as yf\nexcept ImportError:  # the in-browser build has no live source: only stored copies and the mirror\n    yf = None\n\nfrom version import SOURCE_URL\n\n_HERE = os.path.dirname(os.path.abspath(__file__))\n_TICKER_RE = re.compile(r\"[A-Z0-9.\\-^=]{1,20}\")\n\n# The last successful download of each ticker is kept on disk and used when the live source fails.\nSNAPSHOT_DIR = os.environ.get(\"ETF_SNAPSHOT_DIR\", os.path.join(_HERE, \".yf_cache\"))\n# Optional snapshots shipped with the app; read-only, consulted last.\nSEED_DIR = os.path.join(_HERE, \"data\", \"snapshots\")\n# Snapshots of the most used tickers, refreshed daily by a scheduled job and published on a branch\n# of the source repository. Reading them keeps ordinary visits away from the live source, which\n# throttles shared hosting addresses. Set ETF_SNAPSHOT_MIRROR to another base URL, or to \"\" to turn it off.\nMIRROR_BRANCH = \"market-data\"\nMIRROR_URL = os.environ.get(\n    \"ETF_SNAPSHOT_MIRROR\", SOURCE_URL.replace(\"https://github.com/\", \"https://raw.githubusercontent.com/\") + \"/\" + MIRROR_BRANCH)\n# A stored copy fetched within this many hours is used as it is, without contacting the live source.\nSNAPSHOT_MAX_AGE_HOURS = 36\n_MIRROR_MISS_SECONDS = 3600\n_mirror_misses = {}\n# The mirror also publishes index.csv: every ticker it carries, with its name and listing date.\nINDEX_FILE = \"index.csv\"\n_index_cache = {\"at\": float(\"-inf\"), \"entries\": None}\n# Official list of every ETF listed on the Taiwan Stock Exchange (market 1 = listed, issue type I = ETF).\nLISTED_ETF_URL = (\"https://isin.twse.com.tw/isin/class_main.jsp?owncode=&stockname=&isincode=\"\n                  \"&market=1&issuetype=I&industry_code=&Page=1&chklike=Y\")\n_live_requests = set()\n_state_lock = threading.Lock()\n\n# Taiwan Stock Exchange: official, but one month per request and a firewall that rejects anything\n# faster than a request every several seconds. Far too slow for a whole history, so it can only\n# bring a stored snapshot up to date when the main source is down.\n# Off unless ETF_TWSE_TOP_UP=1: from cloud hosts the firewall also refuses requests at random, and\n# the path has not yet completed end to end against the real exchange.\nTWSE_TOP_UP = os.environ.get(\"ETF_TWSE_TOP_UP\") == \"1\"\nTWSE_URL = \"https://www.twse.com.tw/rwd/zh\"\n_TWSE_INTERVAL = 10.0\n_TWSE_ATTEMPTS = 3\n_TWSE_MAX_MONTHS = 3\n_TWSE_FRESH_DAYS = 3\n_TWSE_CACHE_SECONDS = 3600\n_twse_lock = threading.Lock()\n_twse_state = {\"last_call\": float(\"-inf\"), \"dividends\": {}}\n\n# A split the source never back-adjusted shows up as a one-day move this large or larger.\n_SEAM_RATIO = 1.9\n_SEAM_TOLERANCE = 0.15\n# Daily moves beyond max(_ANOMALY_FLOOR, _ANOMALY_SIGMAS x typical daily move) are reported to the user.\n_ANOMALY_FLOOR = 0.25\n_ANOMALY_SIGMAS = 12\n_DIVIDEND_YIELD_CEILING = 0.15\n# A regular payer whose record starts with this many dividend-free months probably has a gap at the source.\n_DIVIDEND_GAP_MONTHS = 24\n_MIN_PAYOUTS_FOR_GAP_CHECK = 4\n\n# Days on which the source shows a permanent level shift that is neither a split nor a market move.\n# 2015-08-24: 00631L closes -33.6% and 00632R +42.6% while their underlying (0050) moves -3.9%, and\n# both stay displaced from it afterwards, which a 2x / -1x fund cannot do.\nKNOWN_BAD_DAYS = {\n    \"00631L.TW\": (\"2015-08-24\",),\n    \"00632R.TW\": (\"2015-08-24\",),\n}\n\n\ndef normalize_ticker(raw):\n    ticker = str(raw).strip().upper()\n    if not ticker:\n        raise ValueError(\"請輸入 Yahoo Finance 代號，例如 0056.TW、00679B.TWO 或 SPY。\")\n    if not _TICKER_RE.fullmatch(ticker):\n        raise ValueError(f\"代號「{ticker}」格式不正確：只能包含英數字與 . - ^ = 符號，最長 20 個字元。\")\n    return ticker\n\n\ndef validate_history(df):\n    if df is None or df.empty:\n        raise ValueError(\"資料來源回傳空值\")\n    if not {\"Close\", \"Dividends\"}.issubset(df.columns):\n        raise ValueError(\"資料缺少價格或配息欄位\")\n    if not isinstance(df.index, pd.DatetimeIndex) or df.index.hasnans or df.index.has_duplicates:\n        raise ValueError(\"行情日期格式異常或包含重複日期\")\n    prices = pd.to_numeric(df['Close'], errors='coerce').dropna()\n    dividends = pd.to_numeric(df['Dividends'], errors='coerce')\n    if prices.empty or not np.isfinite(prices).all() or (prices <= 0).any():\n        raise ValueError(\"歷史價格為空或含無效價格\")\n    if not np.isfinite(dividends).all() or (dividends < 0).any():\n        raise ValueError(\"配息資料含缺值或無效數值，無法可靠計算現金流\")\n\n\n# ------------------------------------------------------------------\n# Snapshots\n# ------------------------------------------------------------------\ndef save_snapshot(df, ticker, directory=None):\n    \"\"\"Write the raw history as CSV. Dates are stored as exchange-local calendar days.\"\"\"\n    directory = directory or SNAPSHOT_DIR\n    if not directory:\n        return None\n    ticker = normalize_ticker(ticker)\n    columns = [c for c in (\"Close\", \"Dividends\", \"Stock Splits\") if c in df.columns]\n    out = df[columns].copy()\n    out.index = pd.DatetimeIndex(out.index).tz_localize(None).normalize()\n    out.index.name = \"Date\"\n    os.makedirs(directory, exist_ok=True)\n    path = os.path.join(directory, f\"{ticker}.csv\")\n    tmp = f\"{path}.{os.getpid()}.tmp\"\n    with open(tmp, \"w\", encoding=\"utf-8\", newline=\"\") as fh:\n        fh.write(f\"# fetched_at={df.attrs.get('fetched_at') or _now()}\\n\")\n        out.to_csv(fh)\n    os.replace(tmp, path)\n    return path\n\n\ndef _parse_snapshot(source, ticker):\n    \"\"\"A stored history from a path or an open text stream, or None if it is unusable.\"\"\"\n    try:\n        if isinstance(source, str):\n            with open(source, encoding=\"utf-8\") as fh:\n                text = fh.read()\n        else:\n            text = source.read()\n        first = text.split(\"\\n\", 1)[0].strip()\n        df = pd.read_csv(io.StringIO(text), comment=\"#\", index_col=\"Date\", parse_dates=[\"Date\"])\n        validate_history(df)\n    except (OSError, ValueError, KeyError):\n        return None\n    fetched_at = first.split(\"=\", 1)[1] if first.startswith(\"# fetched_at=\") else \"\"\n    df.attrs.update(ticker=ticker, data_source=\"snapshot\", fetched_at=fetched_at)\n    return df\n\n\ndef _stored(directory, ticker):\n    return _parse_snapshot(os.path.join(directory, f\"{ticker}.csv\"), ticker) if directory else None\n\n\ndef read_snapshot(ticker):\n    \"\"\"A stored history for the ticker, the local copy before the shipped one, or None.\"\"\"\n    ticker = normalize_ticker(ticker)\n    for directory in (SNAPSHOT_DIR, SEED_DIR):\n        df = _stored(directory, ticker)\n        if df is not None:\n            return df\n    return None\n\n\nIN_BROWSER = sys.platform == \"emscripten\"\n\n\ndef live_source_available():\n    return yf is not None\n\n\ndef _listed_extras():\n    names = set()\n    if os.path.isdir(SEED_DIR):\n        names |= {f[:-4] for f in os.listdir(SEED_DIR) if f.endswith(\".csv\")}\n    listing = os.path.join(_HERE, \"data\", \"mirror_tickers.txt\")\n    if os.path.exists(listing):\n        with open(listing, encoding=\"utf-8\") as fh:\n            names |= {line.split(\"#\")[0].strip() for line in fh if line.split(\"#\")[0].strip()}\n    return names\n\n\ndef available_snapshots():\n    \"\"\"Tickers the app can load without the live source: the mirror's index when it can be read,\n    otherwise the shipped snapshots and the extra list.\"\"\"\n    index = mirror_index()\n    return sorted(set(index) | _listed_extras()) if index else sorted(_listed_extras())\n\n\ndef _http_get_text(url, timeout=8):\n    if IN_BROWSER:  # no sockets in the browser; a synchronous request from the worker instead\n        from pyodide.http import open_url\n        return open_url(url).read()\n    request = urllib.request.Request(url, headers={\"User-Agent\": \"etf-stress-test\"})\n    with urllib.request.urlopen(request, timeout=timeout) as response:\n        return response.read().decode(\"utf-8\")\n\n\ndef parse_index(text):\n    \"\"\"index.csv -> {ticker: {\"name\": ..., \"listed\": ...}}.\"\"\"\n    frame = pd.read_csv(io.StringIO(text), dtype=str, keep_default_na=False)\n    if \"ticker\" not in frame.columns:\n        raise ValueError(\"清單格式不正確\")\n    return {row[\"ticker\"]: {\"name\": row.get(\"name\", \"\"), \"listed\": row.get(\"listed\", \"\")}\n            for _, row in frame.iterrows() if row[\"ticker\"]}\n\n\ndef write_index(entries, directory):\n    \"\"\"Write {ticker: {\"name\", \"listed\"}} as index.csv, sorted by ticker.\"\"\"\n    rows = [{\"ticker\": t, \"name\": e.get(\"name\", \"\"), \"listed\": e.get(\"listed\", \"\")} for t, e in sorted(entries.items())]\n    path = os.path.join(directory, INDEX_FILE)\n    os.makedirs(directory, exist_ok=True)\n    pd.DataFrame(rows, columns=[\"ticker\", \"name\", \"listed\"]).to_csv(path, index=False)\n    return path\n\n\ndef mirror_index():\n    \"\"\"The mirror's index of tickers it carries, or {} when it cannot be read. Cached for an hour.\"\"\"\n    if not MIRROR_URL:\n        return {}\n    with _state_lock:\n        if time.monotonic() - _index_cache[\"at\"] < _MIRROR_MISS_SECONDS:\n            return dict(_index_cache[\"entries\"] or {})\n    try:\n        entries = parse_index(_http_get_text(f\"{MIRROR_URL}/{INDEX_FILE}\"))\n    except (OSError, ValueError):\n        entries = {}\n    with _state_lock:\n        _index_cache.update(at=time.monotonic(), entries=entries)\n    return dict(entries)\n\n\ndef listing_info(ticker):\n    \"\"\"Name and official listing date of a ticker when the mirror's index knows it, else {}.\"\"\"\n    return mirror_index().get(normalize_ticker(ticker), {})\n\n\ndef parse_listed_etfs(html):\n    \"\"\"The exchange's ETF listing page -> {ticker: {\"name\", \"listed\"}} for listed ('上市') ETFs.\"\"\"\n    entries = {}\n    for row in re.findall(r\"<tr[^>]*>(.*?)<\/tr>\", html, re.S | re.I):\n        cells = [re.sub(r\"<[^>]+>|&nbsp;\", \"\", c).strip() for c in re.findall(r\"<td[^>]*>(.*?)<\/td>\", row, re.S | re.I)]\n        if len(cells) < 8 or cells[4] != \"上市\" or cells[5] != \"ETF\":\n            continue\n        code = cells[2].upper()\n        if re.fullmatch(r\"[0-9A-Z]{4,8}\", code):\n            entries[f\"{code}.TW\"] = {\"name\": cells[3], \"listed\": cells[7].replace(\"/\", \"-\")}\n    return entries\n\n\ndef fetch_listed_etfs(attempts=5, pause=40):\n    \"\"\"Every ETF listed on the Taiwan Stock Exchange, from the exchange's own list.\n\n    Its firewall turns away a share of ordinary requests from cloud hosts with a short HTML page,\n    so a refusal is retried after a pause. Raises if every attempt is refused or the list is empty.\n    \"\"\"\n    last = None\n    for attempt in range(attempts):\n        if attempt:\n            time.sleep(pause)\n        try:\n            request = urllib.request.Request(LISTED_ETF_URL, headers={\"User-Agent\": \"Mozilla/5.0\"})\n            with urllib.request.urlopen(request, timeout=90) as response:\n                raw = response.read()\n        except OSError as exc:\n            last = exc\n            continue\n        for encoding in (\"utf-8\", \"cp950\"):\n            try:\n                html = raw.decode(encoding)\n                break\n            except UnicodeDecodeError:\n                continue\n        else:\n            html = raw.decode(\"cp950\", errors=\"replace\")\n        entries = parse_listed_etfs(html)\n        if len(entries) >= 50:          # a refusal page, or a page cut short, has none or very few\n            return entries\n        last = ValueError(f\"清單只有 {len(entries)} 檔，可能被拒絕或不完整\")\n    raise ConnectionError(f\"無法取得上市 ETF 清單：{last}\")\n\n\ndef fetch_mirror(ticker):\n    \"\"\"The daily published snapshot of a ticker, or None. A miss is remembered for an hour.\"\"\"\n    if not MIRROR_URL:\n        return None\n    with _state_lock:\n        if time.monotonic() - _mirror_misses.get(ticker, float(\"-inf\")) < _MIRROR_MISS_SECONDS:\n            return None\n    try:\n        text = _http_get_text(f\"{MIRROR_URL}/{urllib.parse.quote(ticker)}.csv\")\n        df = _parse_snapshot(io.StringIO(text), ticker)\n    except (OSError, ValueError):\n        df = None\n    if df is None:\n        with _state_lock:\n            _mirror_misses[ticker] = time.monotonic()\n    return df\n\n\ndef _age_hours(df):\n    \"\"\"Hours since the copy was fetched from the live source; infinite when unknown.\"\"\"\n    try:\n        fetched = datetime.strptime(df.attrs.get(\"fetched_at\", \"\"), \"%Y-%m-%dT%H:%M:%SZ\").replace(tzinfo=timezone.utc)\n    except ValueError:\n        return float(\"inf\")\n    return (datetime.now(timezone.utc) - fetched).total_seconds() / 3600\n\n\ndef request_live(ticker):\n    \"\"\"Make the next load of this ticker go to the live source even if a recent copy is stored.\"\"\"\n    with _state_lock:\n        _live_requests.add(normalize_ticker(ticker))\n        _mirror_misses.pop(normalize_ticker(ticker), None)\n\n\ndef _now():\n    return datetime.now(timezone.utc).strftime(\"%Y-%m-%dT%H:%M:%SZ\")\n\n\ndef _twse_get(path, **params):\n    \"\"\"One throttled request to the exchange, retried when its firewall turns it away.\n\n    The firewall rejects a share of perfectly ordinary requests from cloud addresses, so a\n    refusal is retried after the usual pause. Raises if every attempt fails or the exchange\n    answers with an error status.\n    \"\"\"\n    url = f\"{TWSE_URL}/{path}?\" + urllib.parse.urlencode({\"response\": \"json\", **params})\n    last_error = None\n    with _twse_lock:\n        for _ in range(_TWSE_ATTEMPTS):\n            wait = _twse_state[\"last_call\"] + _TWSE_INTERVAL - time.monotonic()\n            if wait > 0:\n                time.sleep(wait)\n            try:\n                request = urllib.request.Request(url, headers={\"User-Agent\": \"Mozilla/5.0\"})\n                with urllib.request.urlopen(request, timeout=20) as response:\n                    payload = json.loads(response.read().decode(\"utf-8\"))\n                break\n            except (OSError, ValueError) as exc:  # refused, unreachable, or the firewall's HTML page\n                last_error = exc\n            finally:\n                _twse_state[\"last_call\"] = time.monotonic()\n        else:\n            raise ConnectionError(f\"證交所沒有正常回應：{last_error}\") from last_error\n    if payload.get(\"stat\") != \"OK\":\n        if \"沒有符合條件\" in str(payload.get(\"stat\", \"\")):\n            return {\"fields\": [], \"data\": []}\n        raise ValueError(f\"證交所回應異常：{payload.get('stat')}\")\n    return payload\n\n\ndef _roc_date(text):\n    \"\"\"'114/06/02' or '114年06月02日' (Republic of China calendar) -> Timestamp.\"\"\"\n    year, month, day = (int(x) for x in re.findall(r\"\\d+\", text)[:3])\n    return pd.Timestamp(year + 1911, month, day)\n\n\ndef twse_month_closes(stock_no, period):\n    \"\"\"Closing prices actually traded on the exchange during one calendar month.\"\"\"\n    payload = _twse_get(\"afterTrading/STOCK_DAY\", date=f\"{period.year}{period.month:02d}01\", stockNo=stock_no)\n    if not payload[\"data\"]:\n        return pd.Series(dtype=float)\n    date_col, close_col = payload[\"fields\"].index(\"日期\"), payload[\"fields\"].index(\"收盤價\")\n    closes = {}\n    for row in payload[\"data\"]:\n        try:\n            closes[_roc_date(row[date_col])] = float(str(row[close_col]).replace(\",\", \"\"))\n        except ValueError:\n            continue  # \"--\": listed but not traded that day\n    return pd.Series(closes, dtype=float).sort_index()\n\n\ndef twse_month_distributions(period, through):\n    \"\"\"Ex-dividend and ex-rights events of every listed security in one month, up to `through`.\n\n    Returns (date, code, value, kind) tuples. The exchange rejects ranges longer than about a\n    month and ranges that reach the current day.\n    \"\"\"\n    end = min(period.end_time.normalize(), through)\n    cached = _twse_state[\"dividends\"].get((period, end))\n    if cached and time.monotonic() - cached[0] < _TWSE_CACHE_SECONDS:\n        return cached[1]\n    payload = _twse_get(\"exRight/TWT49U\", startDate=f\"{period.year}{period.month:02d}01\",\n                        endDate=end.strftime(\"%Y%m%d\"))\n    events = []\n    if payload[\"data\"]:\n        f = payload[\"fields\"]\n        cols = [f.index(name) for name in (\"資料日期\", \"股票代號\", \"權值+息值\", \"權/息\")]\n        for row in payload[\"data\"]:\n            date, code, value, kind = (row[c] for c in cols)\n            events.append((_roc_date(date), str(code).strip(), float(str(value).replace(\",\", \"\")), str(kind).strip()))\n    _twse_state[\"dividends\"][(period, end)] = (time.monotonic(), events)\n    return events\n\n\n# Taiwan has kept UTC+8 without daylight saving since 1979. A fixed offset needs no time-zone\n# database, which the in-browser build (Pyodide) does not have.\nTAIPEI = timezone(timedelta(hours=8), \"Asia/Taipei\")\n\n\ndef taipei_now():\n    \"\"\"The current time in Taiwan, as a time-zone-aware Timestamp.\"\"\"\n    return pd.Timestamp.now(tz=TAIPEI)\n\n\ndef _today():\n    return taipei_now().tz_localize(None).normalize()\n\n\ndef top_up_from_twse(snapshot, ticker):\n    \"\"\"Extend a stored snapshot with exchange data. Returns the snapshot itself if there is nothing to add.\n\n    Only for Taiwan Stock Exchange listings (.TW) and gaps of a few months, and only up to the\n    previous day, the latest for which the exchange serves its distribution table. The exchange\n    and the snapshot must agree on the snapshot's last day, and a failure anywhere raises, so\n    the result is never a partial update.\n    \"\"\"\n    if not ticker.endswith(\".TW\"):\n        return snapshot\n    stock_no = ticker[:-3]\n    last = snapshot.index.max()\n    through = _today() - pd.Timedelta(days=1)\n    if (through - last).days <= _TWSE_FRESH_DAYS:\n        return snapshot\n    months = pd.period_range(last, through, freq=\"M\")\n    if len(months) > _TWSE_MAX_MONTHS:\n        return snapshot\n\n    closes = pd.concat([twse_month_closes(stock_no, m) for m in months])\n    if last not in closes.index or abs(closes[last] / snapshot.loc[last, \"Close\"] - 1) > 0.01:\n        raise ValueError(\"證交所與存檔在同一天的價格不一致，不合併\")\n    new = closes[(closes.index > last) & (closes.index <= through)]\n    if new.empty:\n        return snapshot\n\n    added = pd.DataFrame({\"Close\": new, \"Dividends\": 0.0}, index=new.index)\n    for month in months:\n        for date, code, value, kind in twse_month_distributions(month, through):\n            if code != stock_no or date not in added.index:\n                continue\n            if kind != \"息\":\n                raise ValueError(\"補齊期間有除權，價格需要另外還原，不合併\")\n            added.loc[date, \"Dividends\"] += value\n    if \"Stock Splits\" in snapshot.columns:\n        added[\"Stock Splits\"] = 0.0\n    out = pd.concat([snapshot, added[snapshot.columns]])\n    validate_history(out)\n    out.attrs = dict(snapshot.attrs)\n    out.attrs.update(data_source=\"snapshot+twse\", topped_up_to=new.index.max().strftime(\"%Y-%m-%d\"))\n    return out\n\n\ndef _save_quietly(df, ticker):\n    try:\n        save_snapshot(df, ticker)\n    except OSError:\n        pass  # a read-only disk must not stop usable data from being used\n\n\ndef load_history(ticker):\n    \"\"\"Full daily history, from the nearest place that has a recent copy.\n\n    A copy fetched within SNAPSHOT_MAX_AGE_HOURS is used directly: the local one first, then\n    the daily published mirror. Otherwise the live source is asked. If that fails, the newest\n    stored copy of any age is returned, marked as a snapshot and brought up to date from the\n    exchange where that is switched on. request_live() skips the stored copies once.\n    \"\"\"\n    ticker = normalize_ticker(ticker)\n    with _state_lock:\n        forced = ticker in _live_requests\n        _live_requests.discard(ticker)\n\n    local = mirror = None\n    if not forced:\n        local = _stored(SNAPSHOT_DIR, ticker)\n        if local is not None and _age_hours(local) <= SNAPSHOT_MAX_AGE_HOURS:\n            local.attrs[\"data_source\"] = \"cache\"\n            return local\n        mirror = fetch_mirror(ticker)\n        if mirror is not None and _age_hours(mirror) <= SNAPSHOT_MAX_AGE_HOURS:\n            mirror.attrs[\"data_source\"] = \"mirror\"\n            _save_quietly(mirror, ticker)\n            return mirror\n\n    last_error = None\n    # Fetch prices and corporate actions together; a failed dividend request\n    # must not silently turn an income strategy into a zero-dividend strategy.\n    for attempt in range(3 if yf is not None else 0):\n        try:\n            kwargs = {\"period\": \"max\"} if attempt < 2 else {\"start\": \"1900-01-01\"}\n            df = yf.Ticker(ticker).history(\n                **kwargs, auto_adjust=False, actions=True, timeout=20\n            )\n            validate_history(df)\n            df.attrs.update(ticker=ticker, data_source=\"live\", fetched_at=_now())\n            _save_quietly(df, ticker)\n            return df\n        except Exception as exc:\n            last_error = exc\n            if attempt < 2:\n                time.sleep(attempt + 1)\n\n    if forced:\n        local, mirror = _stored(SNAPSHOT_DIR, ticker), fetch_mirror(ticker)\n    copies = [c for c in (local, mirror, _stored(SEED_DIR, ticker)) if c is not None]\n    if copies:\n        snapshot = min(copies, key=_age_hours)   # ties keep the order above: local, mirror, shipped\n        snapshot.attrs[\"data_source\"] = \"snapshot\"\n        if not TWSE_TOP_UP:\n            return snapshot\n        try:\n            return top_up_from_twse(snapshot, ticker)\n        except Exception:\n            return snapshot  # a stale but whole snapshot beats a half-merged one\n    if yf is None:\n        known = available_snapshots()\n        raise ValueError(\n            f\"單機版無法即時查詢行情，只能使用台灣上市的 ETF（目前 {len(known)} 檔，每天自動更新），沒有 {ticker} 的資料。\"\n            \"請確認代號是否正確，例如 0056.TW、00878.TW。要測試其他商品，請使用網頁版。\")\n    raise ValueError(\n        f\"暫時無法取得 {ticker} 的完整歷史資料（已嘗試 3 次），也沒有先前存檔的資料可用。\"\n        \"這不代表代號不存在，也可能是來源暫時異常或限制連線；\"\n        \"請稍後按「重新載入行情」，並檢查代號。\"\n    ) from last_error\n\n\n# ------------------------------------------------------------------\n# Repair\n# ------------------------------------------------------------------\ndef _split_factor(ratio):\n    \"\"\"(scale for earlier prices, human label) if a one-day price ratio looks like an unadjusted split.\"\"\"\n    if ratio <= 1 / _SEAM_RATIO:\n        n = round(1 / ratio)\n        if n >= 2 and abs(ratio * n - 1) <= _SEAM_TOLERANCE:\n            return 1 / n, f\"1 股拆成 {n} 股\"\n    elif ratio >= _SEAM_RATIO:\n        n = round(ratio)\n        if n >= 2 and abs(ratio / n - 1) <= _SEAM_TOLERANCE:\n            return float(n), f\"{n} 股併成 1 股\"\n    return None\n\n\ndef _fix_dividend_units(df, scale, seam_date):\n    \"\"\"Bring dividends still quoted in pre-split units onto the repaired price basis.\n\n    The source back-adjusts prices and dividends to different dates, so the seam in the prices\n    says nothing about which dividends are stale. Stale ones are always the oldest, and they make\n    the yield jump by the split ratio, so the cut-off is the one that makes yearly yields most\n    alike. When every year looks alike the dividends are assumed consistent, unless only the\n    rescaled yield is believable. With very uneven payouts next to the cut-off (a stale year that\n    paid unusually little, or a good year that paid several times the norm) it can land a year or\n    two off.\n    \"\"\"\n    paid = df['Dividends'] > 0\n    if not paid.any():\n        return None\n    prev_close = df['Close'].shift(1).fillna(df['Close'])\n    yearly = (df.loc[paid, 'Dividends'] / prev_close[paid]).groupby(df.index[paid].year).sum()\n    years = list(yearly.index)\n    logs = np.log(yearly.to_numpy())\n    shift = np.log(scale)\n\n    def spread(n_scaled):\n        x = logs.copy()\n        x[:n_scaled] += shift\n        return np.abs(x - np.median(x)).sum()\n\n    costs = [spread(n) for n in range(len(years))]\n    best = int(np.argmin(costs))\n    stale = None\n    if best > 0 and costs[0] - costs[best] >= 0.5 * abs(shift):\n        stale = paid & (df.index.year <= years[best - 1])\n    else:\n        typical = float(np.median(yearly))\n        if not 0.002 <= typical <= 0.20 and 0.002 <= typical * scale <= 0.20:\n            stale = paid & (df.index < seam_date)\n    if stale is None or not stale.any():\n        return None\n    df.loc[stale, 'Dividends'] *= scale\n    dates = df.index[stale]\n    return f\"其中 {int(stale.sum())} 筆配息（{dates[0]:%Y-%m-%d} 至 {dates[-1]:%Y-%m-%d}）仍是分割前的單位，已一併換算\"\n\n\ndef repair_history(df, ticker=\"\"):\n    \"\"\"Undo price seams the source left in. Returns the repaired frame and a note per repair.\n\n    Handles (1) splits that were never back-adjusted, recognised as a one-day jump of a whole\n    ratio in a ticker for which the source reports no split events at all, and (2) the curated\n    KNOWN_BAD_DAYS. A ticker whose split events are reported is left alone: there a large move\n    is more likely real, and it is surfaced by find_anomalies instead.\n    \"\"\"\n    df = df.copy()\n    notes = []\n\n    for day in KNOWN_BAD_DAYS.get(ticker, ()):\n        ts = pd.Timestamp(day)\n        if ts in df.index and df.index.get_loc(ts) > 0:\n            pos = df.index.get_loc(ts)\n            ratio = df['Close'].iloc[pos] / df['Close'].iloc[pos - 1]\n            before = df.index < ts\n            df.loc[before, ['Close', 'Dividends']] *= ratio\n            notes.append(f\"{ts:%Y-%m-%d} 來源價格出現 {ratio - 1:+.1%} 的永久位移，與標的指數走勢不符，\"\n                         \"已視為資料錯誤並把當日漲跌當作 0。\")\n\n    splits = df['Stock Splits'] if 'Stock Splits' in df.columns else None\n    if splits is not None and (pd.to_numeric(splits, errors='coerce').fillna(0) != 0).any():\n        return df, notes\n\n    ratios = df['Close'] / df['Close'].shift(1)\n    jumps = ratios[(ratios <= 1 / _SEAM_RATIO) | (ratios >= _SEAM_RATIO)]\n    for ts in sorted(jumps.index, reverse=True):\n        pos = df.index.get_loc(ts)\n        ratio = df['Close'].iloc[pos] / df['Close'].iloc[pos - 1]\n        found = _split_factor(ratio)\n        if found is None:\n            continue\n        scale, label = found\n        df.loc[df.index < ts, 'Close'] *= scale\n        note = f\"{ts:%Y-%m-%d} 的價格跳動（{ratio - 1:+.1%}）符合{label}的股票分割，而來源沒有還原；已把這天之前的價格換算成同一基準\"\n        dividend_note = _fix_dividend_units(df, scale, ts)\n        notes.append(note + (\"，\" + dividend_note if dividend_note else \"\") + \"。\")\n    return df, notes\n\n\ndef find_anomalies(df, limit=5):\n    \"\"\"Daily moves far outside the asset's own normal range: bad data or a genuine extreme, worth a look either way.\"\"\"\n    ratios = (df['Close'] / df['Close'].shift(1)).dropna()\n    if len(ratios) < 20:\n        return []\n    logs = np.log(ratios)\n    sigma = 1.4826 * float(np.median(np.abs(logs - np.median(logs))))\n    threshold = -np.log(1 - max(_ANOMALY_FLOOR, min(0.9, _ANOMALY_SIGMAS * sigma)))\n    flagged = logs[logs.abs() > threshold]\n    worst = flagged.reindex(flagged.abs().sort_values(ascending=False).index[:limit]).sort_index()\n    notes = [f\"{ts:%Y-%m-%d} 單日 {np.expm1(v):+.1%}\" for ts, v in worst.items()]\n    if len(flagged) > limit:\n        notes.append(f\"另有 {len(flagged) - limit} 筆\")\n    return notes\n\n\n# ------------------------------------------------------------------\n# Monthly series\n# ------------------------------------------------------------------\ndef monthly_data(df, pay_day, repair=True, allow_short=False):\n    \"\"\"One row per calendar month, priced on the first trading day on or after `pay_day`.\n\n    A dividend belongs to the period in which the price went ex-dividend: the first monthly\n    quote on or after its ex-date. Dividends after the latest quote wait for the next one.\n    \"\"\"\n    validate_history(df)\n    if not isinstance(pay_day, (int, np.integer)) or not 1 <= pay_day <= 31:\n        raise ValueError(\"每月扣款日必須介於 1 至 31 日。\")\n    source = dict(df.attrs)\n    df = df.copy().sort_index()\n    df['Close'] = pd.to_numeric(df['Close'], errors='coerce')\n    df['Dividends'] = pd.to_numeric(df['Dividends'], errors='coerce')\n    df.index = pd.to_datetime(df.index).tz_localize(None)\n    df = df.dropna(subset=['Close'])\n    if df.empty or (df['Close'] <= 0).any():\n        raise ValueError(\"歷史價格為空或含非正價格，無法回測。\")\n\n    repairs = []\n    if repair:\n        df, repairs = repair_history(df, source.get('ticker', ''))\n    anomalies = find_anomalies(df)\n\n    selected = []\n    for _, group in df.groupby(df.index.to_period('M')):\n        eligible = group[group.index.day >= pay_day]\n        selected.append(eligible.index[0] if not eligible.empty else group.index[-1])\n    quotes = pd.DatetimeIndex(selected)\n    monthly = df.loc[quotes, ['Close']].copy()\n    monthly['Quote_Date'] = quotes\n    monthly.index = quotes.to_period('M')\n    expected = pd.period_range(monthly.index.min(), monthly.index.max(), freq='M')\n    if not monthly.index.equals(expected):\n        raise ValueError(\"歷史價格有缺漏月份，無法將跨月變動當作單月報酬；請重新載入行情。\")\n\n    paid = df.loc[df['Dividends'] > 0, 'Dividends']\n    period = quotes.searchsorted(paid.index, side='left')\n    in_range = period < len(quotes)\n    per_period = paid[in_range].groupby(period[in_range]).sum()\n    monthly_div = np.zeros(len(quotes))\n    monthly_div[per_period.index.to_numpy()] = per_period.to_numpy()\n\n    monthly['YYYYMM'] = monthly.index\n    monthly['Monthly_Div'] = monthly_div\n    monthly['Price_Return'] = monthly['Close'].pct_change(fill_method=None)\n    monthly['Div_Yield'] = monthly['Monthly_Div'] / monthly['Close'].shift(1)\n    base_month, base_close = monthly.index[0], float(monthly['Close'].iloc[0])\n    monthly = monthly.dropna(subset=['Price_Return'])\n    if monthly.empty and not allow_short:\n        raise too_short_error(source.get('ticker', '') or \"這檔標的\", df.index.min(), base_month)\n\n    rich = monthly['Div_Yield'] > _DIVIDEND_YIELD_CEILING\n    anomalies += [f\"{m} 配息相當於股價的 {y:.1%}\" for m, y in monthly.loc[rich, 'Div_Yield'].items()]\n    payers = monthly.index[monthly['Monthly_Div'] > 0]\n    if len(payers) >= _MIN_PAYOUTS_FOR_GAP_CHECK and (payers[0] - monthly.index[0]).n >= _DIVIDEND_GAP_MONTHS:\n        anomalies.append(f\"{monthly.index[0]} 至 {payers[0] - 1} 沒有任何配息紀錄，之後才開始有。\"\n                         \"如果它當時其實有配息，就是來源缺漏；這段期間的配息以 0 計\")\n\n    monthly.attrs.update(\n        ticker=source.get('ticker', ''),\n        data_source=source.get('data_source', 'live'),\n        fetched_at=source.get('fetched_at', ''),\n        topped_up_to=source.get('topped_up_to', ''),\n        source_start=df.index.min().strftime('%Y-%m-%d'),\n        source_end=df.index.max().strftime('%Y-%m-%d'),\n        repairs=repairs,\n        anomalies=anomalies,\n        base_month=str(base_month),\n        base_close=base_close,\n    )\n    return monthly\n\n\ndef too_short_error(ticker, first_day, base_month):\n    \"\"\"Why a history with a single month of prices cannot be tested yet, and what can be done.\"\"\"\n    return ValueError(\n        f\"{ticker} 的第一筆價格在 {pd.Timestamp(first_day):%Y-%m-%d}，目前只有一個月份的價格，還無法計算月報酬；\"\n        f\"沒有指定替身時，最早要等到 {pd.Period(base_month, freq='M') + 1} 有了第二筆月價才能進場。\"\n        \"如果想現在就測試，可以在側欄「上市前的歷史用哪一檔代替」指定一檔上市更久的 ETF，用它的舊資料補上。\")\n\n\ndef backfill_with_proxy(asset, proxy):\n    \"\"\"Extend a short monthly history backwards with another asset's returns and dividend yields.\n\n    Months before the asset existed take the proxy's price return and dividend yield unchanged;\n    prices are chained backwards from the asset's first real quote so the series stays continuous.\n    Backfilled rows are marked in the `Synthetic` column. Returns the asset untouched when the\n    proxy does not reach back further or leaves a gap before the asset starts.\n    \"\"\"\n    asset = asset.copy()\n    asset['Synthetic'] = False\n    # The asset's first price month: before its first return, or its only month when it has none yet.\n    base = pd.Period(asset.attrs['base_month'], freq='M') if 'base_month' in asset.attrs else asset.index[0] - 1\n    earlier = proxy[proxy.index <= base]\n    if earlier.empty or earlier.index[-1] != base:\n        return asset\n\n    returns = earlier['Price_Return'].to_numpy()\n    close = np.empty(len(earlier))\n    close[-1] = (asset.attrs['base_close'] if 'base_close' in asset.attrs\n                 else asset['Close'].iloc[0] / (1 + asset['Price_Return'].iloc[0]))\n    for i in range(len(earlier) - 1, 0, -1):\n        close[i - 1] = close[i] / (1 + returns[i])\n    previous_close = close / (1 + returns)\n\n    filled = pd.DataFrame({\n        'Close': close,\n        'Quote_Date': earlier['Quote_Date'].to_numpy(),\n        'YYYYMM': earlier.index,\n        'Monthly_Div': earlier['Div_Yield'].to_numpy() * previous_close,\n        'Price_Return': returns,\n        'Div_Yield': earlier['Div_Yield'].to_numpy(),\n        'Synthetic': True,\n    }, index=earlier.index)\n\n    overlap = asset[['Price_Return']].join(proxy[['Price_Return']], rsuffix='_proxy', how='inner')\n    correlation = float(overlap.corr().iloc[0, 1]) if len(overlap) >= 12 else float('nan')\n\n    out = pd.concat([filled, asset[filled.columns]]) if not asset.empty else filled\n    out.attrs = dict(asset.attrs)\n    out.attrs['backfill'] = {\n        'proxy': proxy.attrs.get('ticker', ''),\n        'months': len(filled),\n        'start': str(filled.index[0]),\n        'end': str(filled.index[-1]),\n        'overlap_months': len(overlap),\n        'correlation': correlation,\n    }\n    return out\n\n\ndef align_months(df_a, df_b=None):\n    \"\"\"Join the main asset with the optional second asset on calendar months.\n\n    The result covers the main asset's months up to the last month both have. Months before the\n    second asset existed are kept, with its columns empty, for the engine to model.\n    \"\"\"\n    sources = [dict(df_a.attrs)]\n    if df_b is not None:\n        sources.append(dict(df_b.attrs))\n        end = min(df_a.index.max(), df_b.index.max())\n        a, b = df_a[df_a.index <= end], df_b[df_b.index <= end]\n        if a.empty or b.empty or b.index.min() > end or len(a.index.intersection(b.index)) == 0:\n            raise ValueError(\"兩檔標的沒有共同可回測月份，請更換標的。\")\n        merged = a.join(b, lsuffix='_A', rsuffix='_B', how='left')\n        merged = merged.rename(columns={c: f'{c}_A' for c in ('Synthetic',) if c in merged.columns})\n    else:\n        merged = df_a.rename(columns={c: f'{c}_A' for c in df_a if c != 'YYYYMM'})\n    if merged.empty:\n        raise ValueError(\"兩檔標的沒有共同可回測月份，請更換標的。\")\n    expected = pd.period_range(merged.index.min(), merged.index.max(), freq='M')\n    if not merged.index.equals(expected):\n        raise ValueError(\"共同資料有缺漏月份，無法安全執行逐月回測。\")\n    if 'Synthetic_A' not in merged.columns:\n        merged['Synthetic_A'] = False\n    merged.index = merged.index.to_timestamp()\n    merged.attrs['sources'] = sources\n    return merged\n\n\ndef refresh_snapshots(tickers, directory, pause=0.2):\n    \"\"\"Download each ticker from the live source into `directory`. Returns how many came back live.\n\n    A ticker the live source refuses keeps its newest stored copy, so one bad day does not drop\n    it from the published set.\n    \"\"\"\n    live = 0\n    for position, symbol in enumerate(tickers):\n        if position and pause:\n            time.sleep(pause)\n        try:\n            request_live(symbol)\n            history = load_history(symbol)\n        except ValueError as exc:\n            print(f\"{symbol}: FAILED ({exc})\")\n            continue\n        live += history.attrs.get(\"data_source\") == \"live\"\n        print(f\"{symbol}: {history.attrs.get('data_source')} {history.attrs.get('fetched_at')} -> \"\n              f\"{save_snapshot(history, symbol, directory)}\")\n    return live\n\n\ndef mirror_universe(extra):\n    \"\"\"What the daily refresh publishes: every listed ETF plus `extra`, as {ticker: {\"name\", \"listed\"}}.\n\n    When the exchange's list cannot be fetched, the previously published index stands in, so a\n    bad day does not shrink the set.\n    \"\"\"\n    try:\n        entries = fetch_listed_etfs()\n        print(f\"listed ETFs from the exchange: {len(entries)}\")\n    except ConnectionError as exc:\n        entries = mirror_index()\n        print(f\"{exc}; using the previously published index ({len(entries)} tickers)\")\n    for symbol in extra:\n        entries.setdefault(normalize_ticker(symbol), {\"name\": \"\", \"listed\": \"\"})\n    return entries\n\n\nif __name__ == \"__main__\":\n    import argparse\n\n    parser = argparse.ArgumentParser(description=\"Download market-data snapshots from the live source.\")\n    parser.add_argument(\"tickers\", nargs=\"*\", help=\"Yahoo Finance symbols, e.g. 0050.TW 0056.TW\")\n    parser.add_argument(\"--file\", help=\"text file with one symbol per line (# starts a comment)\")\n    parser.add_argument(\"--listed-etfs\", action=\"store_true\",\n                        help=\"also every ETF listed on the Taiwan Stock Exchange, and write index.csv\")\n    parser.add_argument(\"--dir\", default=SEED_DIR, help=\"folder to write to (default: data/snapshots)\")\n    cli = parser.parse_args()\n    symbols = list(cli.tickers)\n    if cli.file:\n        with open(cli.file, encoding=\"utf-8\") as fh:\n            symbols += [line.split(\"#\")[0].strip() for line in fh if line.split(\"#\")[0].strip()]\n    if cli.listed_etfs:\n        universe = mirror_universe(symbols)\n        symbols = sorted(universe)\n    if not symbols:\n        parser.error(\"no tickers given\")\n    succeeded = refresh_snapshots(symbols, cli.dir)\n    if cli.listed_etfs:\n        published = {t: e for t, e in universe.items() if os.path.exists(os.path.join(cli.dir, f\"{t}.csv\"))}\n        print(f\"index: {len(published)} tickers -> {write_index(published, cli.dir)}\")\n    sys.exit(0 if succeeded else 1)\n","report.py":"\"\"\"A self-contained HTML report of one run: settings, results, tables and charts.\n\nNo Streamlit here: the page hands over plain values and plotly figures and gets a string back.\nEverything that came from the user or the data source is escaped.\n\"\"\"\nfrom html import escape\n\n_STYLE = \"\"\"\nbody { font-family: -apple-system, \"Segoe UI\", \"Noto Sans TC\", \"PingFang TC\", \"Microsoft JhengHei\", sans-serif;\n       color: #1f2933; background: #fff; max-width: 1040px; margin: 0 auto; padding: 32px 20px 56px; line-height: 1.6; }\nh1 { font-size: 26px; margin: 0 0 4px; }\nh2 { font-size: 19px; margin: 40px 0 12px; padding-bottom: 6px; border-bottom: 2px solid #e4e7eb; }\nh3 { font-size: 15px; margin: 22px 0 8px; }\np.meta, p.note { color: #52606d; font-size: 13px; margin: 4px 0; }\np.caption { color: #52606d; font-size: 13px; margin: 6px 0 0; }\ntable { border-collapse: collapse; width: 100%; font-size: 14px; margin: 6px 0; }\nth, td { border: 1px solid #e4e7eb; padding: 6px 10px; text-align: left; vertical-align: top; }\nth { background: #f5f7fa; font-weight: 600; }\ntd.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }\n.columns { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }\n.warn { background: #fffbea; border: 1px solid #f7d070; border-radius: 6px; padding: 8px 12px; font-size: 13px; margin: 6px 0; }\n.footer { margin-top: 44px; padding-top: 14px; border-top: 1px solid #e4e7eb; color: #52606d; font-size: 12px; }\na { color: #0b69a3; word-break: break-all; }\n@media (max-width: 720px) { .columns { grid-template-columns: 1fr; } }\n@media print { h2 { break-after: avoid; } .figure, table { break-inside: avoid; } }\n\"\"\"\n\n\ndef _pairs_table(rows):\n    body = \"\".join(f\"<tr><th>{escape(str(label))}<\/th><td>{escape(str(value))}<\/td><\/tr>\" for label, value in rows)\n    return f\"<table>{body}<\/table>\"\n\n\ndef _frame_table(frame):\n    head = \"<th><\/th>\" + \"\".join(f\"<th class='num'>{escape(str(c))}<\/th>\" for c in frame.columns)\n    body = \"\".join(\n        f\"<tr><th>{escape(str(index))}<\/th>\" + \"\".join(f\"<td class='num'>{escape(str(v))}<\/td>\" for v in row) + \"<\/tr>\"\n        for index, row in zip(frame.index, frame.itertuples(index=False)))\n    return f\"<table><tr>{head}<\/tr>{body}<\/table>\"\n\n\nd
