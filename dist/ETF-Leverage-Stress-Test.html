ef build_report(*, title, version, generated, share_url, settings, data_notes, warnings, summaries,\n                 tables, figures, disclaimer, source_url, closing_notes=()):\n    \"\"\"Return the report as one HTML document.\n\n    settings   -- [(label, value)] describing the run\n    data_notes -- [text] about the market data used and how it was prepared\n    warnings   -- [text] the page showed as cautions\n    summaries  -- [(heading, [(label, value)])], laid out side by side\n    tables     -- [(heading, DataFrame of display strings, caption)]\n    figures    -- [(heading, plotly figure, caption)]; charts load plotly from its CDN\n    closing_notes -- [text] added to the footer\n    \"\"\"\n    parts = [\n        \"<!doctype html><html lang='zh-Hant'><head><meta charset='utf-8'>\",\n        \"<meta name='viewport' content='width=device-width, initial-scale=1'>\",\n        f\"<title>{escape(title)}<\/title><style>{_STYLE}<\/style><\/head><body>\",\n        f\"<h1>{escape(title)}<\/h1>\",\n        f\"<p class='meta'>版本 {escape(version)}｜產生時間 {escape(generated)}<\/p>\",\n    ]\n    if share_url:\n        parts.append(f\"<p class='meta'>用這個連結可以重現同一組設定：<a href='{escape(share_url, quote=True)}'>\"\n                     f\"{escape(share_url)}<\/a><\/p>\")\n\n    parts.append(\"<h2>這次的設定<\/h2>\" + _pairs_table(settings))\n\n    parts.append(\"<h2>主要結果<\/h2><div class='columns'>\")\n    for heading, rows in summaries:\n        parts.append(f\"<div><h3>{escape(heading)}<\/h3>{_pairs_table(rows)}<\/div>\")\n    parts.append(\"<\/div>\")\n    parts.extend(f\"<div class='warn'>{escape(text)}<\/div>\" for text in warnings)\n\n    for heading, frame, caption in tables:\n        parts.append(f\"<h3>{escape(heading)}<\/h3>{_frame_table(frame)}\")\n        if caption:\n            parts.append(f\"<p class='caption'>{escape(caption)}<\/p>\")\n\n    if figures:\n        parts.append(\"<h2>圖表<\/h2><p class='note'>圖表需要連上網路才會顯示（會從 plotly 的 CDN 載入繪圖程式）；滑鼠移上去可以看數值。<\/p>\")\n    for position, (heading, figure, caption) in enumerate(figures):\n        chart = figure.to_html(full_html=False, include_plotlyjs=\"cdn\" if position == 0 else False,\n                               config={\"displaylogo\": False})\n        parts.append(f\"<div class='figure'><h3>{escape(heading)}<\/h3>{chart}\")\n        if caption:\n            parts.append(f\"<p class='caption'>{escape(caption)}<\/p>\")\n        parts.append(\"<\/div>\")\n\n    if data_notes:\n        parts.append(\"<h2>使用的資料<\/h2><ul>\" + \"\".join(f\"<li>{escape(text)}<\/li>\" for text in data_notes) + \"<\/ul>\")\n\n    parts.append(\"<div class='footer'>\" + \"\".join(f\"<p>{escape(text)}<\/p>\" for text in closing_notes)\n                 + f\"<p>{escape(disclaimer)}<\/p>\"\n                 f\"<p>本程式為自由軟體，以 AGPL-3.0 授權，不提供任何擔保。原始碼：\"\n                 f\"<a href='{escape(source_url, quote=True)}'>{escape(source_url)}<\/a><\/p><\/div>\")\n    parts.append(\"<\/body><\/html>\")\n    return \"\".join(parts)\n","credit_limit.py":"\"\"\"How much an unsecured personal loan can be, from income and existing debt. No Streamlit here.\n\nAmounts are in units of 10,000 (萬), as the sidebar takes them; the page converts to dollars.\nAll sentences live here so the page, the report and the tests read the same words.\n\"\"\"\nfrom dataclasses import dataclass\n\nDBR_MULTIPLE = 22               # FSC rule: unsecured debt may not exceed 22 months of income\nDEFAULT_INCOME, DEFAULT_DEBT, DEFAULT_MULTIPLE, DEFAULT_PRODUCT_MAX = 5.0, 0.0, 20, 500\nMULTIPLE_RANGE = (10, 22)\nMIN_YEARLY_INCOME = 30          # 萬; the usual application threshold\nDEFAULT_PRINCIPAL = {\"credit\": 100, \"mortgage\": 300}\nLOAN_STEP = {\"credit\": 10, \"mortgage\": 50}\nRATIO_HIGH, RATIO_DECLINE = 1 / 3, 0.70\nLMODE_OPTIONS = (\"自己輸入\", \"用估計的可核貸金額\")\n\nHELP_INCOME = (\"你每個月平均賺多少。算法：年收入（含年終獎金、分紅）÷ 12。例如年收入 72 萬，就填 6。\"\n               \"填 0 代表不檢查信貸額度。\")\nHELP_DEBT = (\"你現在欠的、沒有拿房子或車子抵押的錢，全部加起來。要算：信用卡未繳的錢和分期、循環利息、預借現金、\"\n             \"現金卡、其他信貸、已經開始還的學貸。不用算：房貸、有抵押的車貸、股票質借、券商融資。\")\nHELP_MULTIPLE = (\"銀行實際肯借你幾倍的月收入，沒有公開的數字，所以這是估計。依網路文章（不是銀行公布的），\"\n                 \"多在 15～18 倍，預設的 20 比較樂觀。想保守一點，可以調低。法規最高是 22 倍。\")\nHELP_PRODUCT_MAX = \"一個信貸產品最多借多少。大型民營銀行常見 500 萬，公股銀行常見 300 萬。專業人士專案可到 1,000～1,200 萬。\"\nHELP_LMODE = (\"自己輸入：本金照你填的算。用估計的可核貸金額：本金直接用下面算出來的一般可核貸金額，不能自己改。\")\nHELP_LOAN = {\"credit\": \"你打算借多少錢來投資。例如填 100 就是借 100 萬。\",\n             \"mortgage\": \"你打算借多少錢來投資。例如填 300 就是借 300 萬。\"}\nHELP_LOAN_ESTIMATED = \"目前用的是估計的可核貸金額，要自己填請把上面改成「自己輸入」。\"\nEXPANDER = \"額度檢查的細項（估計）\"\nLABELS = {\"inc\": \"平均月收入 (萬)\", \"udebt\": \"既有無擔保債務 (萬)\", \"mult\": \"核貸倍數（估計）(倍)\",\n          \"pmax\": \"產品最高額度 (萬)\", \"lmode\": \"貸款金額怎麼決定\"}\n\nL02 = \"⚠️ 超過可借上限 {cap} 萬。計算時會改用 {cap} 萬。\"\nL04 = \"可借上限 {cap} 萬｜一般可核貸約 {z} 萬（估計）\"\nL07 = \"年收入約 {yearly} 萬，未滿 30 萬。多數銀行的信貸申辦門檻是年收入 30 萬。\"\nL08 = \"你的既有無擔保債務 {d} 萬，已經用完法規上限（平均月收入 {inc} 萬 × 22 ＝ {gross} 萬）。依規定，不能再借信貸。\"\nL08_ERROR = \"信貸額度：既有無擔保債務已用完法規上限，無法再借\"\nL09 = \"用估計的可核貸金額算出來是 0 萬，無法計算。請改成「自己輸入」，或調高核貸倍數。\"\nL09_ERROR = \"信貸額度：用估計的可核貸金額算出來是 0 萬，無法計算\"\nL11 = \"填平均月收入可以檢查信貸額度。\"\nL12 = (\"依新聞報導：2026-10-31 起，信貸的資金用途如果寫「投資理財」，銀行要先經你同意，才能查詢你在券商的借貸\"\n       \"（例如融資）。你不同意，就辦不成。\")\nCLOSING = \"信貸額度是估計。各銀行條件常變動，以銀行核定為準。\"\nNOT_CHECKED = \"未檢查（沒有填平均月收入）\"\nHEAT_CELL = \"超限\"\nHEAT_NOTE = \"灰底「超限」的格子：貸款本金超過可借上限 {cap} 萬，銀行不會核貸，所以不計算。\"\nHEAT_HOVER = \"貸款本金 {y} 超過可借上限 {cap} 萬，無法計算\"\nSAFE_SENTENCE = \"以目前其他設定，就算借到可借上限 **{cap} 萬**，破產機率也只有 {r}，仍在 {t} 以下（你目前設定 {cur} 萬）。\"\nSAFE_VALUE = \"{cap} 萬（可借上限）\"\n\n\ndef wan_text(value):\n    \"\"\"An amount in 萬 as `110`, `5.5` or `1,100` (one decimal at most, no trailing zero).\"\"\"\n    text = f\"{round(float(value) + 0.0, 1):,.1f}\".rstrip(\"0\").rstrip(\".\")\n    return \"0\" if text in (\"\", \"-0\") else text\n\n\ndef wan(value):\n    return f\"{wan_text(value)} 萬\"\n\n\n@dataclass(frozen=True)\nclass Credit:\n    \"\"\"Limits for one set of inputs (all in 萬).\"\"\"\n    income: float\n    debt: float\n    multiple: float\n    product_max: float\n\n    @property\n    def gross(self):\n        \"\"\"22 times income, before existing debt.\"\"\"\n        return self.income * DBR_MULTIPLE\n\n    @property\n    def regulatory(self):\n        return max(0.0, self.gross - self.debt)\n\n    @property\n    def approvable(self):\n        \"\"\"Typical approval (an estimate): the multiple, not the legal 22, capped by the product.\"\"\"\n        return max(0.0, min(self.income * self.multiple - self.debt, self.product_max))\n\n    @property\n    def cap(self):\n        return min(self.regulatory, self.product_max)\n\n    @property\n    def capped_by_product(self):\n        return self.product_max < self.regulatory\n\n\ndef assess(income, debt=DEFAULT_DEBT, multiple=DEFAULT_MULTIPLE, product_max=DEFAULT_PRODUCT_MAX):\n    \"\"\"The limits for an income above zero, or None when no income was given (no check).\"\"\"\n    if not income or income <= 0:\n        return None\n    return Credit(float(income), float(debt), float(multiple), float(product_max))\n\n\ndef adopted_principal(credit, entered, estimated=False):\n    \"\"\"The loan actually simulated, in 萬: the estimate, or the input held down to the cap.\"\"\"\n    if credit is None:\n        return float(entered)\n    if estimated:\n        return credit.approvable\n    return min(float(entered), credit.cap)\n\n\ndef is_legacy_link(settings):\n    \"\"\"A V39 link: it names a loan amount but no income, and the loan is a personal loan.\n\n    Such a link must give V39's numbers, so its income counts as 0 (no check).\n    \"\"\"\n    if \"loan\" not in settings or \"inc\" in settings:\n        return False\n    try:\n        return int(float(settings.get(\"type\", \"1\"))) != 0\n    except (ValueError, TypeError, OverflowError):\n        return True\n\n\ndef monthly_ratio(payment, income):\n    \"\"\"Monthly payment after the grace period as a share of average monthly income (in dollars / 萬).\"\"\"\n    return payment / (income * 10_000)\n\n\n# ---- sentences ----\n\ndef summary(credit):\n    \"\"\"L-03.\"\"\"\n    text = (f\"依平均月收入 {wan_text(credit.income)} 萬：法規上限 {wan(credit.regulatory)}、\"\n            f\"一般可核貸約 {wan(credit.approvable)}（估計）、產品最高額度 {wan(credit.product_max)}。\"\n            f\"你的可借上限是 {wan(credit.cap)}。\")\n    if credit.debt > 0:\n        text += f\"已扣掉既有無擔保債務 {wan(credit.debt)}。\"\n    return text\n\n\ndef clamp_notice(credit, entered):\n    \"\"\"L-01a / L-01b (without the warning sign): the input was held down to the cap.\"\"\"\n    if credit.capped_by_product:\n        return (f\"你輸入 {wan(entered)}，但產品最高額度是 {wan(credit.product_max)}。\"\n                f\"以下結果以 {wan(credit.product_max)}計算。\")\n    return (f\"你輸入 {wan(entered)}，但依規定（平均月收入的 22 倍，扣掉既有無擔保債務）最多只能借 {wan(credit.cap)}。\"\n            f\"以下結果以 {wan(credit.cap)}計算。\")\n\n\ndef ratio_notice(ratio, payment):\n    \"\"\"L-05 / L-06 (without the warning sign), or None when the ratio is fine.\"\"\"\n    if ratio <= RATIO_HIGH:\n        return None\n    head = f\"寬限期後每月應繳 ${int(round(payment)):,}，是平均月收入的 {ratio * 100:.1f}%。\"\n    tail = \"這裡只算這筆新貸款，沒有算你其他貸款的月付。\"\n    if ratio > RATIO_DECLINE:\n        return head + \"多數銀行可能婉拒。有銀行規定每月還款不能超過月收入的 70%。\" + tail\n    return head + \"月付比偏高。部分銀行的產品條件寫，每月還款不能超過月收入的三分之一。\" + tail\n\n\ndef income_notice(credit):\n    \"\"\"L-07 (without the warning sign), or None when income is at least the threshold.\"\"\"\n    if credit.income * 12 >= MIN_YEARLY_INCOME:\n        return None\n    return L07.format(yearly=wan_text(credit.income * 12))\n\n\ndef above_estimate_notice(credit, principal):\n    \"\"\"L-10: the input is above the typical approval but still within the cap.\"\"\"\n    if credit.approvable < principal <= credit.cap:\n        return f\"你輸入的 {wan(principal)}，高過一般可核貸的估計 {wan(credit.approvable)}。銀行可能只核給較低的額度。\"\n    return None\n\n\ndef exhausted_notice(credit):\n    \"\"\"L-08 when the cap is 0.\"\"\"\n    return L08.format(d=wan_text(credit.debt), inc=wan_text(credit.income), gross=wan_text(credit.gross))\n\n\ndef switch_toast(type_name, principal, rate, years, grace_years):\n    \"\"\"L-16.\"\"\"\n    grace = f\"寬限期 {grace_years} 年\" if grace_years else \"無寬限期\"\n    return f\"已換成{type_name}的預設值：本金 {principal} 萬、年利率 {rate:g}%、{years} 年、{grace}。\"\n","safety_limit.py":"\"\"\"Safety limit: the most that can be borrowed and the least that must be paid in each month.\n\nRuns the engine's solver and sensitivity grid for one set of settings and turns the outcome into\nwhat the page and the report show: metric values, sentences, captions, the risk map and its\ntable. No Streamlit here; the page decides where each piece goes.\n\nSentences carry **bold** markers; `markdown()` makes them safe for Streamlit (a pair of dollar\nsigns would otherwise be read as a formula) and `plain()` strips them for the report.\n\"\"\"\nimport numpy as np\nimport pandas as pd\nimport plotly.graph_objects as go\n\nimport credit_limit\nimport engine\n\nTARGETS = (\"1\", \"5\", \"10\")  # percent; a link stores the number itself\nDEFAULT_TARGET = \"5\"\n\nPRINCIPAL_STEP = 100_000\nPRINCIPAL_CEILING = 100_000_000\nSALARY_HI, SALARY_STEP = 500_000, 1_000\n\nMULTIPLES = (0.5, 0.75, 1, 1.25, 1.5, 2)\nZERO_SALARY_AXIS = (0, 5_000, 10_000, 20_000, 30_000, 50_000)\n\nBAND_COLORS = (\"#1c5cab\", \"#86b6ef\", \"#f0938f\", \"#b8322f\")\nBAND_NAMES = (\"很安全\", \"達標\", \"超過\", \"危險\")\n\nHEADER = \"🛡️ 安全邊界：最多能借多少？\"\nANCHOR = \"safe-limit\"\nINTRO = (\"用蒙地卡羅模擬反過來找：其他設定都不變的情況下，貸款本金最多可以多少、每月最少要能自掏多少，\"\n         \"破產機率才不會超過你能接受的上限。要跑幾十次模擬，所以按按鈕才會計算。\")\nTARGET_LABEL = \"你能接受的破產機率最多多少\"\nTARGET_HELP = \"例如選 5%，就是要求「每 20 種可能的未來裡，最多只有 1 種會繳不出貸款」。選越低越保守。\"\nBUTTON = \"🛡️ 計算安全邊界\"\nNOT_YET = \"還沒有計算。按「計算安全邊界」開始。\"\nNEEDS_RUN = \"請先按「開始計算」更新上方結果，再計算安全邊界。\"\nNO_MONTE_CARLO = \"歷史資料不到 2 個月，無法做蒙地卡羅模擬，所以也無法計算安全邊界。\"\nSTALE = \"⚠️ 設定已變更，下面的安全邊界是用舊設定算的。按「計算安全邊界」重新計算。\"\nSTALE_TARGET = \"⚠️ 你改了能接受的破產機率，下面還是 {t} 的結果。按「計算安全邊界」重新計算。\"\nNO_SALARY = \"你沒有把「薪水（自掏腰包）」排進還款順位，所以每月自掏多少都不影響結果，這一項不計算。\"\nRANDOM_SEED = \"你關閉了「固定亂數」，安全邊界固定用同一組抽樣計算，所以數字可能和上方的破產機率略有不同。\"\nMAP_TITLE = \"破產機率地圖：借多少 × 每月自掏多少\"\nMAP_NOTE = (\"怎麼看這張圖：每一格是「只把貸款本金換成左邊的數字、每月最多自掏換成下面的數字，其他設定都不變」時的破產機率。\"\n            \"◆ 是你目前的設定。藍色是在你選的上限（{t}）以內，紅色是超過；顏色越深，離上限越遠。\"\n            \"往上（借越多）、往左（自掏越少）通常越危險。\")\nMAP_NOTE_2 = \"安全邊界只看蒙地卡羅模擬的破產機率，不看歷史回測。它是用歷史行情重新組合出來的估計，不是保證。\"\nMAP_NOTE_FEE = \"「—」的格子：貸款本金不比開辦費多，借到的錢扣掉開辦費就沒了，無法計算。\"\nMAP_NOTE_NO_SALARY = \"你沒有把薪水排進還款順位，所以地圖上每一格幾乎都一樣：借多少、每月自掏多少，都不太影響破產機率。\"\nMAP_NOTE_ZERO_SALARY = (\"你的每月最多自掏是 0，所以最左邊「$0」那一欄上下幾乎都一樣：不自掏的話，借多少都不太影響破產機率。\"\n                        \"往右看，是每月補一點錢的效果。\")\nBLANK_COLOR, BLANK_TEXT_COLOR = \"#a3a29c\", \"#0b0b0b\"\nNO_SUPPORT = (\"你沒有用薪水補貼還款。這時借多借少，每月還款和買進的資產都等比例變大或變小，破產機率幾乎不變，\"\n              \"所以「最多可以借」不是「{hi} 萬以上」就是「不到 {lo} 萬」，不會落在中間。\")\nALL_MEET_SCALES = (\"借越多，每月還款和買進的資產都會等比例變大，每月自掏那筆固定的錢就越不夠看，所以破產機率不會一直升高，\"\n                   \"而是慢慢接近「完全不自掏」時的水準；這個水準在 {t} 以下，所以整個搜尋範圍都達標。\")\nALL_MEET_NO_SUPPORT = \"這次的破產機率在 {t} 以下，所以整個搜尋範圍都達標。\"\nLOW_IS_NOT_SAFE = \"破產機率低不代表風險小：借越多，一旦出事賠得也越多。\"\nNONE_MEET_NO_SUPPORT = \"這次的破產機率超過 {t}，調整本金沒有用；要從利率、年限、還款的順序或每月自掏的錢下手。\"\nNONE_MEET = \"問題可能不在借多少，而是利率、年限、每月自掏的錢或還款的順序；可以看看下面的地圖。\"\nTABLE_TITLE = \"用表格看這張地圖\"\nSTEPS = (\"（1/3）找最多能借多少…\", \"（2/3）找每月最少要自掏多少…\", \"（3/3）畫破產機率地圖（{n} 格）…\")\nCURRENT_MARK = \"◆ 目前\"\n\n\ndef principal_bounds(principal, loan_fee, cap=None):\n    \"\"\"Search range for the loan: from the first multiple of 100,000 above the fee to ten times the loan.\n\n    A borrowing limit `cap` (dollars) lowers the top to the last multiple of 100,000 within it.\n    \"\"\"\n    lo = max(PRINCIPAL_STEP, (int(loan_fee) // PRINCIPAL_STEP + 1) * PRINCIPAL_STEP)\n    hi = min(principal * 10, PRINCIPAL_CEILING)\n    if cap is not None:\n        hi = min(hi, cap // PRINCIPAL_STEP * PRINCIPAL_STEP)\n    return float(lo), float(max(lo, hi))\n\n\ndef _round_half_up(value):\n    return int(np.floor(value + 0.5))\n\n\ndef _unique(values):\n    return list(dict.fromkeys(values))\n\n\ndef map_axes(principal, salary_cap):\n    \"\"\"Loans and monthly caps for the risk map, in whole dollars; repeats from rounding are dropped.\"\"\"\n    principals = _unique(float(_round_half_up(principal * m)) for m in MULTIPLES)\n    caps = ZERO_SALARY_AXIS if salary_cap == 0 else (_round_half_up(salary_cap * m) for m in MULTIPLES)\n    return principals, _unique(float(c) for c in caps)\n\n\ndef compute(df, params, target, on_step=None, cap=None):\n    \"\"\"Find both limits and the risk map for `params` at a target of `target` percent.\n\n    `cap` is the borrowing limit in dollars, when there is one: the search stops there and\n    map rows above it are left empty.\n\n    `on_step(fraction, text)` is called before each stage. The result holds everything needed\n    to show it again later, after the settings have moved on.\n    \"\"\"\n    step = on_step or (lambda fraction, text: None)\n    rate = int(target) / 100\n    lo, hi = principal_bounds(params.principal, params.loan_fee, cap)\n    step(0.0, STEPS[0])\n    principal = engine.solve_for(df, params, \"principal\", rate, lo, hi, PRINCIPAL_STEP)\n    salary = None\n    if engine.SALARY in params.source_order:\n        step(1 / 3, STEPS[1])\n        salary = engine.solve_for(df, params, \"salary_cap\", rate, 0.0, float(SALARY_HI), SALARY_STEP)\n    principals, caps = map_axes(params.principal, params.salary_cap)\n    step(2 / 3, STEPS[2].format(n=len(principals) * len(caps)))\n    # A loan the fee would swallow whole cannot be simulated; its row stays empty.\n    usable = [p for p in principals if p > params.loan_fee and (cap is None or p <= cap)]\n    grid = pd.DataFrame(np.nan, index=principals, columns=caps)\n    if usable:\n        grid.loc[usable] = engine.sensitivity_grid(df, params, usable, caps, mc_paths=params.mc_paths).to_numpy()\n    return {\"target\": str(target), \"paths\": int(params.mc_paths), \"seed_is_random\": params.seed is None,\n            \"salary_in_order\": engine.SALARY in params.source_order,\n            \"principal\": principal, \"salary\": salary, \"lo\": lo, \"hi\": hi, \"cap\": cap, \"loan_fee\": float(params.loan_fee),\n            \"current_principal\": float(params.principal), \"current_salary\": float(params.salary_cap), \"grid\": grid}\n\n\n# ---- formatting ----\n\ndef target_text(target):\n    return f\"{target}%\"\n\n\ndef ruin_text(rate, target):\n    \"\"\"A ruin rate to one decimal, or two when it sits within 0.1 point of the target.\"\"\"\n    if rate != rate:\n        return \"—\"\n    close = abs(rate - int(target) / 100) < 0.001 - 1e-12\n    return f\"{rate * 100:.2f}%\" if close else f\"{rate * 100:.1f}%\"\n\n\ndef wan(value):\n    \"\"\"An amount in units of 10,000 (萬), without trailing zeros.\"\"\"\n    text = f\"{value / 10_000:,.4f}\".rstrip(\"0\").rstrip(\".\")\n    return text or \"0\"\n\n\ndef dollars(value):\n    return f\"${int(round(value)):,}\"\n\n\ndef markdown(text):\n    return text.replace(\"$\", \"\\\\$\")\n\n\ndef plain(text):\n    return text.replace(\"**\", \"\")\n\n\ndef _view(label, value, sentence, style, captions=(), delta=None, delta_color=\"normal\"):\n    return {\"label\": label, \"value\": value, \"delta\": delta, \"delta_color\": delta_color, \"sentence\": sentence,\n            \"style\": style, \"captions\": list(captions)}\n\n\ndef has_salary_support(record):\n    \"\"\"Whether salary can top up payments at all: it is a repayment source and its cap is above zero.\"\"\"\n    return record[\"salary_in_order\"] and record[\"current_salary\"] > 0\n\n\ndef principal_view(record):\n    \"\"\"Metric, sentence (with its alert style) and captions for the most that can be borrowed.\"\"\"\n    res, t = record[\"principal\"], target_text(record[\"target\"])\n    cur, r, n = record[\"current_principal\"], ruin_text(record[\"principal\"].ruin_rate, record[\"target\"]), record[\"paths\"]\n    no_support = NO_SUPPORT.format(hi=wan(record[\"hi\"]), lo=wan(record[\"lo\"]))\n    if res.status == \"all_meet\" and record.get(\"cap\") is not None:\n        wan_cap = credit_limit.wan_text(record[\"cap\"] / 10_000)\n        caption = (ALL_MEET_SCALES.format(t=t) if has_salary_support(record)\n                   else no_support + ALL_MEET_NO_SUPPORT.format(t=t))\n        return _view(\"最多可以借\", credit_limit.SAFE_VALUE.format(cap=wan_cap),\n                     credit_limit.SAFE_SENTENCE.format(cap=wan_cap, r=r, t=t, cur=wan(cur)), \"success\",\n                     [caption + LOW_IS_NOT_SAFE])\n    if res.status == \"all_meet\":\n        caption = (ALL_MEET_SCALES.format(t=t) if has_salary_support(record)\n                   else no_support + ALL_MEET_NO_SUPPORT.format(t=t))\n        return _view(\"最多可以借\", f\"{wan(record['hi'])} 萬以上\",\n                     f\"以目前其他設定，就算借到搜尋上限 **{wan(record['hi'])} 萬**，破產機率也只有 {r}，\"\n                     f\"仍在 {t} 以下（你目前設定 {wan(cur)} 萬）。\", \"success\", [caption + LOW_IS_NOT_SAFE])\n    if res.status == \"none_meet\":\n        caption = NONE_MEET if has_salary_support(record) else no_support + NONE_MEET_NO_SUPPORT.format(t=t)\n        return _view(\"最多可以借\", f\"不到 {wan(record['lo'])} 萬\",\n                     f\"以目前其他設定，就算只借 **{wan(record['lo'])} 萬**，破產機率也有 {r}，達不到 {t} 以下。\", \"error\",\n                     [caption])\n    value, diff = res.value, res.value - cur\n    captions = [f\"借 {wan(value)} 萬時，破產機率約 {r}（{n:,} 次模擬）。\"]\n    if cur > value:\n        captions.append(f\"⚠️ 你目前設定的 {wan(cur)} 萬已經超過這個上限。\")\n    delta, color = ((\"和目前相同\", \"off\") if diff == 0\n                    else (f\"{'+' if diff > 0 else '-'}{wan(abs(diff))} 萬（比目前）\", \"normal\"))\n    return _view(\"最多可以借\", f\"{wan(value)} 萬\",\n                 f\"以目前其他設定，要讓破產機率在 {t} 以下，最多可以借 **{wan(value)} 萬**（你目前設定 {wan(cur)} 萬）。\",\n                 \"success\" if cur <= value else \"warning\", captions, delta, color)\n\n\ndef salary_view(record):\n    \"\"\"Like principal_view for the least monthly out-of-pocket cap; None when it was not searched.\"\"\"\n    res = record[\"salary\"]\n    if res is None:\n        return None\n    t, cur, n = target_text(record[\"target\"]), record[\"current_salary\"], record[\"paths\"]\n    r = ruin_text(res.ruin_rate, record[\"target\"])\n    if res.status == \"all_meet\":\n        return _view(\"每月最少要自掏\", dollars(0),\n                     f\"以目前其他設定，就算每月完全不自掏，破產機率也只有 {r}，仍在 {t} 以下。\", \"success\")\n    if res.status == \"none_meet\":\n        return _view(\"每月最少要自掏\", f\"超過 {dollars(SALARY_HI)}\",\n                     f\"以目前其他設定，就算每月最多自掏到 **{dollars(SALARY_HI)}**，破產機率仍有 {r}，達不到 {t} 以下。\",\n                     \"error\", [\"光靠多掏錢救不回來，可以試著降低貸款本金再算一次。\"])\n    value, diff = res.value, res.value - cur\n    captions = [f\"每月最多自掏 {dollars(value)} 時，破產機率約 {r}（{n:,} 次模擬）。\"]\n    if cur < value:\n        captions.append(f\"⚠️ 你目前設定的 {dollars(cur)} 不夠，每月還差 {dollars(value - cur)}。\")\n    delta, color = ((\"和目前相同\", \"off\") if diff == 0\n                    else (f\"{'+' if diff > 0 else '-'}{dollars(abs(diff))}（比目前）\", \"inverse\"))\n    return _view(\"每月最少要自掏\", dollars(value),\n                 f\"以目前其他設定，要讓破產機率在 {t} 以下，每月最少要能自掏 **{dollars(value)}**（你目前設定 {dollars(cur)}）。\",\n                 \"success\" if cur >= value else \"warning\", captions, delta, color)\n\n\n# ---- risk map ----\n\ndef _labels(record):\n    grid = record[\"grid\"]\n    return [f\"{wan(p)} 萬\" for p in grid.index], [dollars(c) for c in grid.columns]\n\n\ndef _current_cell(record):\n    grid = record[\"grid\"]\n    rows = [i for i, p in enumerate(grid.index) if p == record[\"current_principal\"]]\n    cols = [j for j, c in enumerate(grid.columns) if c == record[\"current_salary\"]]\n    return (rows[0], cols[0]) if rows and cols else None\n\n\ndef bands(rates, target):\n    \"\"\"Colour band of each ruin rate: 0 very safe, 1 within the target, 2 over it, 3 more than twice it.\"\"\"\n    t = int(target) / 100\n    rates = np.asarray(rates, dtype=float)\n    out = np.digitize(np.nan_to_num(rates), [t / 2, t, 2 * t], right=True).astype(float)\n    out[np.isnan(rates)] = np.nan\n    return out\n\n\ndef _band_ticks(target):\n    t = int(target) / 100\n    a, b, c = (f\"{v * 100:g}%\" for v in (t / 2, t, 2 * t))\n    return [f\"{BAND_NAMES[0]}（≤ {a}）\", f\"{BAND_NAMES[1]}（{a}–{b}）\", f\"{BAND_NAMES[2]}（{b}–{c}）\",\n            f\"{BAND_NAMES[3]}（> {c}）\"]\n\n\ndef over_cap_rows(record):\n    \"\"\"Which map rows borrow more than the limit (the fee rule comes first: those rows show \"—\").\"\"\"\n    cap, fee = record.get(\"cap\"), record.get(\"loan_fee\", 0)\n    return [cap is not None and p > cap and p > fee for p in record[\"grid\"].index]\n\n\ndef map_cells(record):\n    \"\"\"Text of every cell: the ruin rate, \"—\" where it could not be computed, the current one marked.\n\n    Rows above the borrowing limit read \"超限\".\n    \"\"\"\n    grid, target, here = record[\"grid\"], record[\"target\"], _current_cell(record)\n    over = over_cap_rows(record)\n    return [[credit_limit.HEAT_CELL if over[i] else ruin_text(v, target) for v in row]\n            for i, row in enumerate(grid.to_numpy())], here\n\n\ndef _blank_hover(record, y_labels, over):\n    \"\"\"Hover of the grey layer: the fee reason alone, or per row when some rows are over the limit.\"\"\"\n    fee_text = \"貸款本金 {y} 不比開辦費多，無法計算\"\n    if not any(over):\n        return {\"hovertemplate\": fee_text.replace(\"{y}\", \"%{y}\") + \"<extra><\/extra>\"}\n    cap = credit_limit.wan_text(record[\"cap\"] / 10_000)\n    return {\"hovertemplate\": \"%{hovertext}<extra><\/extra>\",\n            \"hovertext\": [[credit_limit.HEAT_HOVER.format(y=y_labels[i], cap=cap) if over[i]\n                           else fee_text.format(y=y_labels[i]) for _ in range(len(record[\"grid\"].columns))]\n                          for i in range(len(y_labels))]}\n\n\ndef map_figure(record):\n    grid, target = record[\"grid\"], record[\"target\"]\n    y_labels, x_labels = _labels(record)\n    cells, here = map_cells(record)\n    blank = grid.isna().to_numpy()\n    over = over_cap_rows(record)\n    text = [[\"\" if blank[i, j] else cell + (f\"<br>{CURRENT_MARK}\" if (i, j) == here else \"\")\n             for j, cell in enumerate(row)] for i, row in enumerate(cells)]\n    z = [[None if v != v else v for v in row] for row in bands(grid.to_numpy(), target).tolist()]\n    scale = []\n    for i, color in enumerate(BAND_COLORS):\n        scale += [[i / 4, color], [(i + 1) / 4, color]]\n    fig = go.Figure()\n    if blank.any():\n        # Its own layer underneath: the theme would otherwise pick a text colour that vanishes on grey.\n        fig.add_trace(go.Heatmap(\n            z=[[0 if b else None for b in row] for row in blank], x=x_labels, y=y_labels, zmin=0, zmax=1,\n            colorscale=[[0, BLANK_COLOR], [1, BLANK_COLOR]], showscale=False, xgap=2, ygap=2, hoverongaps=False,\n            text=[[credit_limit.HEAT_CELL if over[i] else \"—\" if b else \"\" for b in row] for i, row in enumerate(blank)],\n            texttemplate=\"%{text}\", textfont=dict(color=BLANK_TEXT_COLOR),\n            **_blank_hover(record, y_labels, over)))\n    fig.add_trace(go.Heatmap(\n        z=z, x=x_labels, y=y_labels, zmin=-0.5, zmax=3.5, colorscale=scale, text=text, texttemplate=\"%{text}\",\n        customdata=cells, xgap=2, ygap=2, hoverongaps=False,\n        hovertemplate=(f\"貸款本金 %{{y}}｜每月最多自掏 %{{x}}<br>破產機率 %{{customdata}}（{record['paths']:,} 次模擬）\"\n                       \"<extra><\/extra>\"),\n        colorbar=dict(title=dict(text=\"破產機率\"), tickvals=[0, 1, 2, 3], ticktext=_band_ticks(target))))\n    if here is not None:\n        i, j = here\n        for color, width in ((\"#ffffff\", 6), (\"#0b0b0b\", 2.5)):\n            fig.add_shape(type=\"rect\", x0=j - 0.5, x1=j + 0.5, y0=i - 0.5, y1=i + 0.5, layer=\"above\",\n                          line=dict(color=color, width=width))\n    fig.update_layout(xaxis_title=\"每月最多自掏（元）\", yaxis_title=\"貸款本金\", height=400, margin=dict(t=30, b=10))\n    fig.update_xaxes(type=\"category\")\n    fig.update_yaxes(type=\"category\")\n    return fig\n\n\ndef map_table(record):\n    y_labels, x_labels = _labels(record)\n    cells, here = map_cells(record)\n    if here is not None:\n        cells[here[0]][here[1]] = f\"◆ {cells[here[0]][here[1]]}\"\n    return pd.DataFrame(cells, index=y_labels, columns=x_labels)\n\n\ndef map_note(record):\n    return MAP_NOTE.format(t=target_text(record[\"target\"]))\n\n\ndef has_blank_cells(record):\n    \"\"\"Whether some cell is empty because the fee swallows the loan.\"\"\"\n    over = over_cap_rows(record)\n    return any(blank and not over[i] for i, blank in enumerate(record[\"grid\"].isna().to_numpy().any(axis=1)))\n\n\ndef has_over_cap_rows(record):\n    return any(over_cap_rows(record))\n\n\ndef over_cap_note(record):\n    return credit_limit.HEAT_NOTE.format(cap=credit_limit.wan_text(record[\"cap\"] / 10_000))\n\n\ndef map_salary_note(record):\n    \"\"\"Why the map hardly changes when there is no salary to fall back on; None otherwise.\"\"\"\n    if not record[\"salary_in_order\"]:\n        return MAP_NOTE_NO_SALARY\n    if record[\"current_salary\"] == 0:\n        return MAP_NOTE_ZERO_SALARY\n    return None\n\n\n# ---- report ----\n\ndef report_group(record):\n    return f\"安全邊界（破產機率 ≤ {target_text(record['target'])}）\"\n\n\ndef report_rows(record):\n    res, target = record[\"principal\"], record[\"target\"]\n    if res.status == \"all_meet\":\n        most, at = f\"{wan(record['hi'])} 萬以上\", f\"借到 {wan(record['hi'])} 萬時的破產機率\"\n    elif res.status == \"none_meet\":\n        most, at = f\"不到 {wan(record['lo'])} 萬\", f\"只借 {wan(record['lo'])} 萬時的破產機率\"\n    else:\n        most = f\"{wan(res.value)} 萬（目前 {wan(record['current_principal'])} 萬）\"\n        at = f\"借 {wan(res.value)} 萬時的破產機率\"\n    rows = [(\"最多可以借\", most), (at, ruin_text(res.ruin_rate, target))]\n    sal = record[\"salary\"]\n    if sal is None:\n        return rows + [(\"每月最少要自掏\", \"不計算（薪水沒有排進還款順位）\")]\n    if sal.status == \"all_meet\":\n        least, at = dollars(0), \"完全不自掏時的破產機率\"\n    elif sal.status == \"none_meet\":\n        least, at = f\"超過 {dollars(SALARY_HI)}\", f\"每月自掏 {dollars(SALARY_HI)} 時的破產機率\"\n    else:\n        least = f\"{dollars(sal.value)}（目前 {dollars(record['current_salary'])}）\"\n        at = f\"每月自掏 {dollars(sal.value)} 時的破產機率\"\n    return rows + [(\"每月最少要自掏\", least), (at, ruin_text(sal.ruin_rate, target))]\n\n\ndef report_table_note(record):\n    salary = salary_view(record)\n    parts = [plain(principal_view(record)[\"sentence\"]), plain(salary[\"sentence\"]) if salary else NO_SALARY,\n             map_note(record)]\n    if has_blank_cells(record):\n        parts.append(MAP_NOTE_FEE)\n    if has_over_cap_rows(record):\n        parts.append(over_cap_note(record))\n    return \"\".join(parts)\n","ui_state.py":"\"\"\"Input widgets whose values survive page switches and travel in the URL.\n\nEvery input is declared with a short key. The key doubles as the URL query parameter, so the\naddress bar always describes the current settings and can be shared as-is. Values that equal\nthe default are left out to keep links short. Anything read back from a URL is parsed and\nrange-checked before use; anything that fails is ignored in favour of the default.\n\nAll state lives in st.session_state, which is per browser session — nothing here is shared\nbetween users.\n\"\"\"\nimport streamlit as st\n\n_STORE = \"_settings\"  # key -> serialised value, for every input that differs from its default\n\n\ndef begin(migrate=None):\n    \"\"\"Call at the top of the page, before any input is drawn.\n\n    `migrate(settings)` may rewrite the settings read from an old link; it runs once per session,\n    on the first load only.\n    \"\"\"\n    if _STORE not in st.session_state:\n        store = {k: st.query_params[k] for k in st.query_params}\n        if migrate is not None:\n            migrate(store)\n        st.session_state[_STORE] = store\n\n\ndef pin(key, value):\n    \"\"\"Write `key` into the address bar even when it equals its default.\"\"\"\n    st.session_state[_STORE][key] = _fmt(value)\n\n\ndef end():\n    \"\"\"Call at the bottom of the page: publishes the current settings to the address bar.\"\"\"\n    wanted = dict(st.session_state[_STORE])\n    if wanted != {k: st.query_params[k] for k in st.query_params}:\n        st.query_params.from_dict(wanted)\n\n\ndef forget(*keys):\n    \"\"\"Drop inputs so they fall back to their defaults (safe to call from widget callbacks).\"\"\"\n    for key in keys:\n        st.session_state.pop(key, None)\n        st.session_state[_STORE].pop(key, None)\n\n\ndef settings():\n    return dict(st.session_state[_STORE])\n\n\ndef _seed(key, default, parse):\n    if key in st.session_state:\n        return\n    value = default\n    raw = st.session_state[_STORE].get(key)\n    if raw is not None:\n        try:\n            value = parse(raw)\n        except (ValueError, TypeError, IndexError):\n            value = default\n    st.session_state[key] = value\n\n\ndef _remember(key, raw, default_raw):\n    if raw == default_raw:\n        st.session_state[_STORE].pop(key, None)\n    else:\n        st.session_state[_STORE][key] = raw\n\n\ndef _kind(*values):\n    return float if any(isinstance(v, float) for v in values) else int\n\n\ndef _snap(value, lo, hi, step, kind):\n    if value != value:  # NaN\n        raise ValueError(\"not a number\")\n    if hi is not None:\n        value = min(value, hi)\n    if lo is not None:\n        value = max(value, lo)\n    if step and lo is not None:\n        value = lo + round((value - lo) / step) * step\n        if hi is not None and value > hi:\n            value -= step\n    return int(round(value)) if kind is int else round(float(value), 8)\n\n\ndef _fmt(value):\n    return f\"{value:.10g}\" if isinstance(value, float) else str(value)\n\n\ndef slider(key, label, lo, hi, default, step=None, **kwargs):\n    kind = _kind(lo, hi, default, step)\n    if lo >= hi:\n        # A slider needs at least two positions; with one there is nothing to choose.\n        st.caption(f\"{label}：{_fmt(kind(lo))}（目前只有這個選項）\")\n        return kind(lo)\n    default = _snap(default, lo, hi, step, kind)\n    _seed(key, default, lambda raw: _snap(kind(float(raw)), lo, hi, step, kind))\n    st.session_state[key] = _snap(st.session_state[key], lo, hi, step, kind)\n    value = st.slider(label, lo, hi, step=step, key=key, **kwargs)\n    _remember(key, _fmt(value), _fmt(default))\n    return value\n\n\ndef range_slider(key, label, lo, hi, default, step=None, **kwargs):\n    kind = _kind(lo, hi, step, *default)\n\n    def clean(pair):\n        a, b = sorted(_snap(kind(float(v)), lo, hi, step, kind) for v in pair)\n        return (a, b)\n\n    def parse(raw):\n        parts = raw.split(\"~\")\n        if len(parts) != 2:\n            raise ValueError(raw)\n        return clean(parts)\n\n    def fmt(pair):\n        return f\"{_fmt(pair[0])}~{_fmt(pair[1])}\"\n\n    default = clean(default)\n    _seed(key, default, parse)\n    st.session_state[key] = clean(st.session_state[key])\n    value = st.slider(label, lo, hi, step=step, key=key, **kwargs)\n    _remember(key, fmt(value), fmt(default))\n    return value\n\n\ndef number(key, label, default, step, min_value=None, max_value=None, **kwargs):\n    kind = _kind(default, step)\n    _seed(key, default, lambda raw: _snap(kind(float(raw)), min_value, max_value, None, kind))\n    st.session_state[key] = _snap(st.session_state[key], min_value, max_value, None, kind)\n    value = st.number_input(label, min_value=min_value, max_value=max_value, step=step, key=key, **kwargs)\n    _remember(key, _fmt(value), _fmt(default))\n    return value\n\n\ndef checkbox(key, label, default, **kwargs):\n    def parse(raw):\n        if raw not in (\"0\", \"1\"):\n            raise ValueError(raw)\n        return raw == \"1\"\n\n    _seed(key, bool(default), parse)\n    value = st.checkbox(label, key=key, **kwargs)\n    _remember(key, str(int(value)), str(int(bool(default))))\n    return value\n\n\ndef choice(key, label, options, default, universe=None, widget=None, by_value=False, **kwargs):\n    \"\"\"Pick one of `options`.\n\n    Links store the position of the choice within `universe` (the full, fixed list of\n    possibilities) so they stay valid if labels are reworded; `by_value` stores the text\n    itself, for lists that depend on data.\n    \"\"\"\n    options = list(options)\n    universe = list(universe) if universe is not None else options\n    if default not in options:\n        default = options[0]\n    _seed(key, default, (lambda raw: raw) if by_value else (lambda raw: universe[int(raw)]))\n    if st.session_state[key] not in options:\n        st.session_state[key] = default\n    value = (widget or st.selectbox)(label, options, key=key, **kwargs)\n\n    def fmt(v):\n        return str(v) if by_value else str(universe.index(v))\n\n    _remember(key, fmt(value), fmt(default))\n    return value\n\n\ndef text(key, label, default, clean, **kwargs):\n    \"\"\"Free text. `clean` normalises a value or raises ValueError; it guards what a link may inject.\"\"\"\n    _seed(key, default, clean)\n    value = st.text_input(label, key=key, **kwargs)\n    _remember(key, value, default)\n    return value\n","version.py":"\"\"\"The one place the app's version label and source link live.\"\"\"\nAPP_VERSION = \"V39\"\n# Where anyone using a deployed copy can get its source, as the AGPL requires. A modified\n# deployment must point this at its own source.\nSOURCE_URL = \"https://github.com/Wayweiwayne/ETF-Leverage-Stress-Test\"\n","data/mirror_tickers.txt":"# 每日自動更新時，除了「所有台灣上市 ETF」（由證交所清單自動取得）之外，額外一併更新的標的。\n# 一行一個 Yahoo Finance 代號。證交所清單暫時取不到時，至少會更新這些。\n00878.TW\n00631L.TW\n0056.TW\n0050.TW\n006208.TW\n00919.TW\n00929.TW\n00713.TW\n","data/snapshots/0050.TW.csv":"# fetched_at=2026-11-12T08:44:55Z\nDate,Close,Dividends,Stock Splits\n2009-01-02,32.869998931884766,0.0,0.0\n2009-01-05,36.59000015258789,0.0,0.0\n2009-01-06,36.56999969482422,0.0,0.0\n2009-01-07,32.2099990
