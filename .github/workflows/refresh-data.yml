name: refresh market data

# Downloads the tickers in data/mirror_tickers.txt once a day and publishes them on the
# market-data branch, where the app reads them instead of asking Yahoo Finance on every visit.
# The branch holds a single commit that is replaced each run, so the repository does not grow.

on:
  schedule:
    - cron: "37 10 * * *"   # 18:37 in Taipei, after the market has closed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download from the live source
        # A ticker that fails keeps its previously published copy; the step fails only if none succeed.
        run: python market_data.py --file data/mirror_tickers.txt --dir published
      - name: Publish
        working-directory: published
        run: |
          printf '%s\n' \
            '# Market data snapshots' '' \
            'Raw daily history from Yahoo Finance for the tickers in `data/mirror_tickers.txt` on the main branch.' \
            'Replaced every day by the "refresh market data" workflow; the app reads these files instead of' \
            'contacting Yahoo Finance on every visit. The data belongs to its original source and is not covered' \
            "by the project's licence." > README.md
          git init -q -b market-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Market data $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" market-data
