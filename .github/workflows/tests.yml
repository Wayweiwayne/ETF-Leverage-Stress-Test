name: tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pyflakes
      - run: python -m pyflakes *.py pages/*.py
      - if: matrix.python-version != '3.13'
        run: python -m unittest -v
      - if: matrix.python-version == '3.13'
        run: pip install coverage
      - name: Tests with coverage (report only, no threshold)
        if: matrix.python-version == '3.13'
        run: |
          python -m coverage run --branch --source=. --omit='test_*.py,.venv/*,.github/*' -m unittest -v
          python -m coverage report -m --skip-empty --ignore-errors
