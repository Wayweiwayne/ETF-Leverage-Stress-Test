# Temporary: compares Yahoo and official TWSE dividends and times the official fetch. Remove after sprint 6.
name: probe-twse
on:
  push:
    branches: [claude/eloquent-lovelace-jzgzpv]
    paths: [.github/workflows/probe-twse.yml, .github/probe/**]
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python .github/probe/compare_dividends.py official_out
